<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Nicht gefunden · Übungsprüfungen</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* GitHub Pages liefert diese Seite bei jeder unbekannten Adresse aus.
   Sie steht bewusst für sich allein — ohne Schiene, ohne Skripte, damit
   sie auch dann noch etwas zeigt, wenn sonst etwas kaputt ist. */
:root{--bg:#000;--card:#141416;--label:#f5f5f7;--label-2:rgba(235,235,245,.6);
  --label-3:rgba(235,235,245,.32);--blue:#0a84ff;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;
  padding:32px;background:var(--bg);color:var(--label);font-family:var(--sans);
  font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
.wrap{width:min(520px,100%);text-align:center}
.code{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--label-3)}
h1{margin:12px 0 0;font-size:clamp(26px,7vw,34px);font-weight:700;letter-spacing:-.03em;
  line-height:1.12}
p{margin:14px 0 0;color:var(--label-2);font-size:16px}
.go{display:inline-block;margin-top:28px;background:var(--blue);color:#fff;
  border-radius:100px;padding:12px 26px;font-size:15.5px;font-weight:600;
  letter-spacing:-.012em;text-decoration:none}
.go:hover{opacity:.88}
.hint{margin-top:22px;font-size:13.5px;color:var(--label-3)}
.hint a{color:var(--label-2)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">Fehler 404</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Vielleicht wurde eine Unterlage verschoben oder entfernt, oder in der
       Adresse hat sich ein Zeichen verirrt.</p>
    <a class="go" href="/">Zur Startseite</a>
    <p class="hint">Sollte hier etwas sein, das fehlt:
       <a href="mailto:sakshneer@ethz.ch">sakshneer@ethz.ch</a></p>
  </main>
</body>
</html>
