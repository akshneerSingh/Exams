<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Übungsprüfungen und Unterlagen</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================================
   Startseite.

   Links die Schiene mit den Abschnitten aus content/index.json, rechts der
   Inhalt des gewählten Ordners. Alles, was hier steht, liegt im Repository und
   ist für jeden sichtbar. Was nicht sichtbar ist: der gelöste Fortschritt —
   der bleibt im Browser des jeweiligen Besuchers.
   ========================================================================== */

:root{
  --bg:#000; --card:#141416; --card-2:#1d1d20; --raised:#2a2a2e;
  --hair:rgba(255,255,255,.08);
  --label:#f5f5f7; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.32);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,
         "Helvetica Neue",Helvetica,Arial,sans-serif;
  --rail-w:236px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--sans);
  font-size:16px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:rgba(10,132,255,.35)}
button,input{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ============ Schiene ============ */
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail-w);z-index:45;
  background:#08080a;border-right:.5px solid var(--hair);
  display:flex;flex-direction:column;padding:22px 14px 16px;
  padding-top:calc(22px + env(safe-area-inset-top))}
.brand{padding:0 8px;margin-bottom:4px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.018em}
.brand span{display:block;font-size:12px;color:var(--label-3);font-weight:500;
  margin-top:2px;line-height:1.35}
.railtitle{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);padding:0 8px;margin:26px 0 8px}
.seg{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0}
.seg button{display:flex;align-items:center;gap:8px;width:100%;color:var(--label-2);
  font-size:14px;font-weight:500;letter-spacing:-.011em;padding:9px 10px;
  border-radius:9px;text-align:left;transition:background .15s,color .15s}
.seg button:hover{background:rgba(118,118,128,.16);color:var(--label)}
.seg button[aria-selected="true"]{background:rgba(10,132,255,.16);color:var(--blue);font-weight:600}
.seg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg .cnt{margin-left:auto;padding-left:10px;font-size:11.5px;font-weight:600;
  color:var(--label-3);font-variant-numeric:tabular-nums}
.seg button[aria-selected="true"] .cnt{color:var(--blue);opacity:.85}
.seg .sect{margin-top:14px}
.railfoot{margin-top:auto;padding-top:18px}
.mini{padding:0 8px 12px}
.mini .lab{font-size:11.5px;color:var(--label-3);font-weight:500;display:flex;
  justify-content:space-between;margin-bottom:7px;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .35s ease}
.tools{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:8px;width:100%;color:var(--label-2);
  font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:9px;
  text-align:left;transition:.15s}
.chip:hover{background:rgba(118,118,128,.16);color:var(--label)}
.lamp{width:7px;height:7px;border-radius:50%;background:var(--label-3);margin-left:auto;flex:none}
.lamp.ok{background:var(--green)}

/* ============ Bühne ============ */
main{margin-left:var(--rail-w);padding:46px 28px 80px}
main > article{max-width:760px;margin:0 auto;min-width:0}
.crumb{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:10px;
  display:inline-flex;align-items:center;gap:4px}
h1{font-size:32px;font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:0}
.sub{font-size:14px;color:var(--label-3);margin-top:6px;max-width:56ch}
.sectitle{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin:34px 0 10px}

.resume{display:block;background:linear-gradient(180deg,rgba(10,132,255,.14),rgba(10,132,255,.06));
  border:.5px solid rgba(10,132,255,.28);border-radius:16px;padding:20px;
  transition:.15s;margin-top:18px}
.resume:hover{border-color:rgba(10,132,255,.5)}
.resume .kick{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--blue);margin-bottom:9px}
.resume h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25}
.resume .where{font-size:14px;color:var(--label-2);margin-top:5px}
.resume .row{display:flex;align-items:center;gap:14px;margin-top:16px}
.resume .progress{flex:1}
.resume .pct{font-size:13px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;flex:none}
.resume .go{background:var(--blue);color:#fff;border-radius:100px;padding:9px 18px;
  font-size:14.5px;font-weight:600;letter-spacing:-.012em;flex:none}

.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.card{display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:14px;padding:15px 16px;transition:.15s;min-width:0;text-align:left}
.card:hover{background:var(--card-2)}
.card .ico{flex:none;width:26px;text-align:center;color:var(--label-3);font-size:15px}
.card .body{flex:1 1 0;min-width:0;max-width:100%;text-align:left}
.card h3{font-size:16.5px;font-weight:600;letter-spacing:-.016em;margin:0;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3,.card .meta{display:block;max-width:100%}
.card .meta{font-size:13px;color:var(--label-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .body,.card .foot{display:block;max-width:100%}
.card .foot{display:flex}
.resume h2,.resume .where{overflow-wrap:break-word}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:11px;min-width:0}
.card .foot .progress{flex:1;max-width:200px}
.card .stat{font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums}
.card .stat.done{color:var(--green)}
.chev{flex:none;color:var(--label-3);font-size:17px}

.empty{background:var(--card);border-radius:14px;padding:26px 20px;text-align:center}
.empty b{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.empty p{margin:0;font-size:14px;color:var(--label-3);line-height:1.5}

/* ============ Suche ============ */
.search{position:relative;margin:0 8px 4px}
.search input{width:100%;padding:8px 30px 8px 30px;border-radius:9px;
  border:.5px solid transparent;background:rgba(118,118,128,.18);
  font-size:13.5px;font-family:var(--sans);letter-spacing:-.011em;color:var(--label)}
.search input::placeholder{color:var(--label-3)}
.search input:focus{outline:none;border-color:var(--blue);background:rgba(118,118,128,.24)}
.search .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--label-3);font-size:12px;pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;color:var(--label-3);font-size:11px;
  display:none;place-items:center}
.search.has .clr{display:grid}
.search .clr:hover{background:rgba(118,118,128,.3);color:var(--label)}
.hit-path{font-size:12px;color:var(--label-3);margin-top:2px}

/* ============ Startseite ============ */
.hero{margin-bottom:8px}
#lead{font-size:17px;line-height:1.55;color:var(--label-2);
  margin:14px 0 26px;max-width:62ch;white-space:pre-line}
.hero .lead:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tile{display:block;width:100%;background:var(--card);border-radius:16px;padding:22px;
  transition:.15s;min-width:0;text-align:left;color:inherit}
.tile:hover{background:var(--card-2)}
.tile .ti{font-size:19px;color:var(--label-3);margin-bottom:12px}
.tile h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.tile p{margin:6px 0 0;font-size:13.5px;color:var(--label-3);line-height:1.5}
.tile .n{margin-top:14px;font-size:12.5px;color:var(--label-3);
  font-variant-numeric:tabular-nums}

/* ============ Verwaltung ============ */
.rowbtn{flex:none;width:34px;height:34px;border-radius:50%;color:var(--label-3);
  font-size:13px;letter-spacing:.04em;transition:.15s}
.rowbtn:hover{background:rgba(118,118,128,.2);color:var(--label)}
.seg .kebab{flex:none;width:20px;text-align:center;color:var(--label-3);font-size:11px;
  letter-spacing:.04em;opacity:0;transition:opacity .15s}
.seg button:hover .kebab,.seg button[aria-selected="true"] .kebab{opacity:1}
.drop{border:1.5px dashed var(--hair);border-radius:14px;padding:26px 18px;
  text-align:center;color:var(--label-3);font-size:14px;transition:.15s}
.drop.over{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.07)}
.queue{display:grid;gap:6px}
.qrow{display:flex;align-items:center;gap:10px;background:var(--card-2);
  border-radius:10px;padding:9px 11px;min-width:0}
.qrow .qi{flex:none;color:var(--label-3);font-size:13px;width:18px;text-align:center}
.qrow input{flex:1;min-width:0;background:transparent;border:0;border-radius:0;
  padding:2px 0;font-size:14.5px;font-family:var(--sans);letter-spacing:-.012em}
.qrow .qm{flex:none;font-size:12px;color:var(--label-3);white-space:nowrap}
.qrow .qx{flex:none;color:var(--label-3);font-size:15px;width:22px}
.qrow.bad{background:rgba(255,69,58,.12)}
.qrow.bad .qm{color:var(--red)}
.busy{opacity:.5;pointer-events:none}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;
  border-radius:11px;background:var(--card-2);text-align:left;font-size:15px;
  letter-spacing:-.012em;transition:.15s}
.pick:hover{background:var(--raised)}
.pick.danger{color:var(--red)}

/* ============ Blatt ============ */
dialog{width:min(460px,calc(100vw - 28px));padding:0;border:.5px solid var(--hair);
  border-radius:18px;background:var(--card);color:var(--label);
  box-shadow:0 40px 100px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-head{padding:20px 20px 0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.sheet-body{padding:16px 20px;display:grid;gap:12px;max-height:66vh;overflow-y:auto}
.sheet-foot{padding:0 20px 20px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border-radius:100px;
  padding:12px 24px;font-size:15.5px;font-weight:600;letter-spacing:-.012em;
  text-align:center;transition:.15s}
.btn:hover{opacity:.88}
.btn.ghost{background:rgba(118,118,128,.24);color:var(--label)}
.hint{font-size:13.5px;color:var(--label-3);line-height:1.5}
.code{display:block;padding:14px;border-radius:12px;background:#000;
  border:.5px solid var(--hair);text-align:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;
  letter-spacing:.08em;word-break:break-all;color:var(--label)}
input[type=text]{width:100%;padding:11px 13px;border:.5px solid var(--hair);
  border-radius:10px;background:#000;font-size:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.note{padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.45}
.note.ok{background:rgba(48,209,88,.14);color:var(--green)}
.note.bad{background:rgba(255,69,58,.14);color:var(--red)}

/* ============ schmal ============ */
@media (max-width:860px){
  .rail{position:sticky;top:0;bottom:auto;width:100%;max-width:100vw;flex-direction:row;
    align-items:center;gap:10px;padding:9px 14px;
    padding-top:calc(9px + env(safe-area-inset-top));border-right:0;
    border-bottom:.5px solid var(--hair);background:rgba(8,8,10,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);overflow-x:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .brand,.railtitle,.mini{display:none}
  .seg{flex-direction:row;gap:2px;background:rgba(118,118,128,.2);border-radius:9px;
    padding:2px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{padding:6px 11px;font-size:13px;border-radius:7px;white-space:nowrap}
  .seg .cnt{display:none}
  .seg .sect{margin-top:0}
  .railfoot,.tools{flex:none}
  .railfoot{margin:0 0 0 auto;padding:0}
  .tools{flex-direction:row}
  .chip{padding:6px 10px;font-size:13px;white-space:nowrap}
  .chip .lbl{display:none}
  main{margin-left:0;padding:24px 16px 60px;width:100%;min-width:0}
  h1{font-size:26px}
  .card{padding:14px}
  .card .foot .progress{max-width:none}
  .card .chev{display:none}
  .resume .row{flex-wrap:wrap}
  .resume .go{width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(() => {
"use strict";

const CFG = window.APP_CONFIG || {};
const PROG = "pruefung:progress:";
const $ = s => document.querySelector(s);

let TREE = null;      /* Abschnitte aus content/index.json */
let path = [];        /* Indexpfad in den Baum, z.B. [0,1,0] */

/* ==================== Baum ==================== */
function nodeAt(p){
  let node = { children: TREE ? TREE.sections : [] };
  p.forEach(i => { node = (node.children || [])[i]; });
  return node;
}
function isFolder(n){ return n && (n.type === "folder" || Array.isArray(n.sections) || (!n.type && n.children)); }
function countQuiz(n){
  if(!n) return 0;
  if(n.type === "quiz" || n.type === "pdf") return 1;
  return (n.children || []).reduce((s,c) => s + countQuiz(c), 0);
}
function quizzesIn(n, out){
  out = out || [];
  if(!n) return out;
  if(n.type === "quiz") out.push(n);
  (n.children || []).forEach(c => quizzesIn(c, out));
  return out;
}
function allQuizzes(){
  return (TREE ? TREE.sections : []).reduce((a,s) => a.concat(quizzesIn(s)), []);
}

/* ==================== Fortschritt ==================== */
const rd = (k,f) => { try{ const v = localStorage.getItem(k); return v===null?f:JSON.parse(v); }catch(_){ return f; } };
const idFor = q => "file:" + q.file;
function progressOf(q){
  const s = rd(PROG + idFor(q), null);
  if(!s || !Array.isArray(s.rounds) || !s.rounds[0]) return { done:0, total:0, last:null };
  const r0 = s.rounds[0];
  const r = s.rounds[s.round || 0] || r0;
  return {
    done: Object.keys(r0.answers || {}).length,
    total: s.questionCount || 0,
    last: r && Number.isInteger(r.lastQ) ? r.lastQ : null
  };
}

/* ====================================================================
   Suche

   Bei ein paar hundert Einträgen ist der einfache Durchlauf durch alle das
   schnellste Verfahren — unter einer Millisekunde. Sortiert wird nicht die
   Datenbasis, sondern die Trefferliste: Titelanfang schlägt Titelmitte,
   Titel schlägt Ordnername.

   Umlaute werden vorher aufgelöst, damit «prufung» auch «Prüfung» findet.
   ==================================================================== */

let query = "";

function fold(text){
  return String(text || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "ss");
}

function search(term){
  const q = fold(term).trim();
  if(q.length < 2) return [];
  const hits = [];

  const walk = (node, trail, target) => {
    (node.children || []).forEach((child, i) => {
      const here = target.concat(i);
      const name = fold(child.title);
      const where = trail.join(" › ");
      let score = -1;
      if(name.startsWith(q)) score = 0;
      else if(name.includes(q)) score = 1;
      else if(fold(child.meta).includes(q) || fold(child.blurb).includes(q)) score = 2;
      else if(fold(where).includes(q)) score = 3;

      if(score >= 0) hits.push({ node: child, target: here, where, score });
      if(child.children) walk(child, trail.concat(child.title), here);
    });
  };

  TREE.sections.forEach((section, si) => {
    /* Die Bereiche selbst sind ebenfalls Treffer — «quizzes» soll den
       Bereich finden, nicht nur seinen Inhalt. */
    const name = fold(section.title);
    let score = -1;
    if(name.startsWith(q)) score = 0;
    else if(name.includes(q)) score = 1;
    else if(fold(section.blurb).includes(q)) score = 2;
    if(score >= 0) hits.push({ node: section, target: [si], where: "Bereich", score });
    walk(section, [section.title], [si]);
  });

  /* Einträge vor Ordnern, dann nach Güte, dann alphabetisch. */
  hits.sort((a, b) => {
    const ea = a.node.file ? 0 : 1;
    const eb = b.node.file ? 0 : 1;
    if(ea !== eb) return ea - eb;
    if(a.score !== b.score) return a.score - b.score;
    return a.node.title.localeCompare(b.node.title, "de");
  });
  return hits.slice(0, 60);
}

/* ==================== Zeichnen ==================== */
function renderRail(){
  const nav = $("#nav"); nav.textContent = "";
  if(!TREE) return;

  const add = (label, target, depth, count, isSection) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = isSection ? "sect" : "";
    b.setAttribute("aria-selected", String(JSON.stringify(target) === JSON.stringify(path)));
    b.style.paddingLeft = (10 + depth*14) + "px";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = label;
    const cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = count || "";
    b.append(nm, cnt);
    if(admin && target.length){
      const k = document.createElement("span");
      k.className = "kebab"; k.textContent = "•••";
      k.addEventListener("click", ev => { ev.stopPropagation(); nodeMenu(target); });
      b.appendChild(k);
    }
    b.addEventListener("click", () => { path = target; render(); });
    nav.appendChild(b);
  };

  TREE.sections.forEach((section, si) => {
    add(section.title, [si], 0, countQuiz(section), true);
    const walk = (node, base, depth) => {
      (node.children || []).forEach((child, ci) => {
        if(child.type !== "folder") return;
        add(child.title, base.concat(ci), depth, countQuiz(child), false);
        if(depth < 6) walk(child, base.concat(ci), depth + 1);
      });
    };
    walk(section, [si], 1);
  });

  const quizzes = allQuizzes();
  const totals = quizzes.reduce((acc,q) => {
    const p = progressOf(q);
    acc.done += p.done; acc.total += p.total; return acc;
  }, { done:0, total:0 });
  const mini = $("#mini");
  mini.hidden = !totals.total;
  if(totals.total){
    $("#ratio").textContent = totals.done + " / " + totals.total;
    $("#pfill").style.width = Math.round(totals.done/totals.total*100) + "%";
  }
  $("#lamp").className = "lamp" + (Sync.configured() && Sync.meta().lastSync ? " ok" : "");
}

/* Eine Eintragskarte — auch von der Trefferliste benutzt. */
function entryCard(child, target, showPath){
  if(child.type === "pdf"){
    const a = document.createElement("a");
    a.className = "card"; a.dataset.kind = "pdf";
    a.href = child.file; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = '<span class="ico" aria-hidden="true">▤</span>'
      + '<span class="body"><h3></h3><span class="meta"></span></span>'
      + '<span class="chev" aria-hidden="true">↗</span>';
    a.querySelector("h3").textContent = child.title;
    a.querySelector(".meta").textContent = showPath || child.meta || "PDF";
    return a;
  }

  const p = progressOf(child);
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  const done = p.total && p.done >= p.total;
  const a = document.createElement("a");
  a.className = "card"; a.dataset.kind = "quiz";
  a.href = "quiz.html?file=" + encodeURIComponent(child.file);
  a.innerHTML = '<span class="ico" aria-hidden="true">◉</span>'
    + '<span class="body"><h3></h3><span class="meta"></span>'
    + '<span class="foot"><span class="progress"><span class="progress-fill"></span></span>'
    + '<span class="stat"></span></span></span>'
    + '<span class="chev" aria-hidden="true">›</span>';
  a.querySelector("h3").textContent = child.title;
  a.querySelector(".meta").textContent = showPath || child.meta || "Kprim-Übungsprüfung";
  const fill = a.querySelector(".progress-fill");
  fill.style.display = "block"; fill.style.height = "100%"; fill.style.width = pct + "%";
  if(done) fill.style.background = "var(--green)";
  const stat = a.querySelector(".stat");
  stat.textContent = done ? "vollständig" : p.done ? p.done + " / " + p.total : "nicht begonnen";
  if(done) stat.classList.add("done");
  if(!p.done) a.querySelector(".foot").style.display = "none";
  return a;
}

/* Die zuletzt bearbeitete, noch offene Prüfung — auf der Startseite und in
   jedem Ordner, damit man von überall zurück in die Arbeit kommt. */
function renderResume(){
  const slot = $("#resumeSlot"); slot.textContent = "";
  const stamps = Sync.meta().stamps || {};
  const open = allQuizzes()
    .map(q => ({ q, p: progressOf(q) }))
    .filter(x => x.p.done > 0 && x.p.total && x.p.done < x.p.total)
    .sort((a,b) => ((stamps[idFor(b.q)]||{}).updated||0) - ((stamps[idFor(a.q)]||{}).updated||0))[0];
  if(!open) return;
  const pct = Math.round(open.p.done/open.p.total*100);
  const el = document.createElement("a");
  el.className = "resume";
  el.href = "quiz.html?file=" + encodeURIComponent(open.q.file);
  el.innerHTML = '<div class="kick">Fortsetzen</div><h2></h2><div class="where"></div>'
    + '<div class="row"><div class="progress"><div class="progress-fill"></div></div>'
    + '<span class="pct"></span><span class="go">Weiterlösen</span></div>';
  el.querySelector("h2").textContent = open.q.title;
  el.querySelector(".where").textContent =
    (open.p.last !== null ? "Zuletzt Frage " + (open.p.last+1) + " · " : "")
    + open.p.done + " von " + open.p.total + " beantwortet";
  el.querySelector(".progress-fill").style.width = pct + "%";
  el.querySelector(".pct").textContent = pct + "%";
  slot.appendChild(el);
}

  renderResume();

        + '<span class="body"><h3></h3><span class="meta"></span></span>'
        + '<span class="chev" aria-hidden="true">↗</span>';

      a.querySelector(".meta").textContent = child.meta || "PDF";
      cards.appendChild(a);
      if(admin) attachMenu(a, (path.length?path:[]).concat(kids.indexOf(child)));
      return;
    }

    const p = progressOf(child);
    const pct = p.total ? Math.round(p.done/p.total*100) : 0;
    const done = p.total && p.done >= p.total;
    const a = document.createElement("a");
    a.className = "card";
    a.dataset.kind = "quiz";
    a.href = "quiz.html?file=" + encodeURIComponent(child.file);

      + '<span class="stat"></span></span></span>'

    fill.style.display = "block";
    fill.style.height = "100%";
    fill.style.width = pct + "%";
    if(done) fill.style.background = "var(--green)";
    const stat = a.querySelector(".stat");
    stat.textContent = done ? "vollständig" : p.done ? p.done + " / " + p.total : "nicht begonnen";
    if(done) stat.classList.add("done");
    if(!p.done) a.querySelector(".foot").style.display = "none";
    cards.appendChild(a);

/* ====================================================================
   Verwaltung

   Sichtbar nur, wenn auf diesem Gerät ein GitHub-Token hinterlegt ist.
   Jede Änderung schreibt content/index.json neu und committet sie zusammen
   mit den neuen Dateien in einem Zug.
   ==================================================================== */

let admin = false;

/* Ein Blatt mit Auswahlknöpfen. Die öffentliche Fassung hat sonst nur das
   Gerätewechsel-Blatt, das seinen Inhalt selbst schreibt. */
function menuSheet(title, items){

    const b = document.createElement("button");
    b.type = "button";

    if(item.depth) b.style.paddingLeft = (14 + item.depth*16) + "px";
    b.textContent = item.label;
    b.addEventListener("click", () => { sheet.close(); item.run(); });
    body.appendChild(b);
  });
  sheet.showModal();
}

function refreshAdmin(){
  admin = !!(window.Admin && Admin.enabled());
  $("#addBtn").hidden = !admin;
  $("#folderBtn").hidden = !admin;

/* Der Baum wird lokal geändert und danach als ganze Datei committet. */
function treeJSON(){ return JSON.stringify(TREE, null, 2) + "\n"; }

async function saveTree(message, extra){
  const changes = (extra || []).concat([
    { path: (CFG.contentIndex || "content/index.json"), content: treeJSON() }
  ]);
  await Admin.commit(changes, message);
}

function parentOf(p){ return p.slice(0, -1); }
function listAt(p){
  return p.length ? (nodeAt(p).children || (nodeAt(p).children = [])) : TREE.sections;
}

/* Alle Ordner als flache Liste, für die Verschieben-Auswahl. */
function folderList(){
  const out = [];
  const walk = (node, base, depth) => {
    (node.children || []).forEach((child, i) => {
      if(child.type !== "folder") return;
      out.push({ label: child.title, target: base.concat(i), depth });
      walk(child, base.concat(i), depth + 1);
    });
  };
  TREE.sections.forEach((section, si) => {
    out.push({ label: section.title, target: [si], depth: 0 });
    walk(section, [si], 1);
  });
  return out;
}

function attachMenu(card, target){
  const b = document.createElement("button");
  b.className = "rowbtn"; b.type = "button"; b.textContent = "•••";
  b.setAttribute("aria-label", "Verwalten");
  b.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); nodeMenu(target); });
  const chev = card.querySelector(".chev");
  if(chev) card.insertBefore(b, chev); else card.appendChild(b);
}

/* Startseite bearbeiten — Titel und Einleitungstext liegen im
   Inhaltsverzeichnis, also ist es dieselbe Schreibaktion wie sonst. */
function homeMenu(){
  menuSheet("Startseite", [
    { label: "Titel ändern", run: async () => {
        const t = prompt("Titel der Seite", TREE.title || "Übungsprüfungen");
        if(!t || !t.trim()) return;
        TREE.title = t.trim();
        await run("Titel geändert", () => saveTree("Titel geändert"));
      } },
    { label: "Einleitungstext ändern", run: async () => {
        const t = prompt("Text auf der Startseite (leer lassen zum Entfernen)", TREE.intro || "");
        if(t === null) return;
        if(t.trim()) TREE.intro = t; else delete TREE.intro;
        await run("Einleitung geändert", () => saveTree("Einleitung geändert"));
      } }
  ]);
}

function nodeMenu(target){
  const node = nodeAt(target);
  const isSection = target.length === 1;
  const items = [
    { label: "Umbenennen", run: async () => {
        const name = prompt("Neuer Titel", node.title);
        if(!name || !name.trim()) return;
        node.title = name.trim();
        await run("Umbenannt: " + node.title, () => saveTree("Umbenannt: " + node.title));
      } }
  ];

  if(!isSection){
    items.push({ label: "Verschieben", run: () => {
      const choices = folderList()
        .filter(f => JSON.stringify(f.target) !== JSON.stringify(target)
                  && !JSON.stringify(f.target).startsWith(JSON.stringify(target).slice(0,-1)))
        .map(f => ({ label: f.label, depth: f.depth, run: async () => {
          const from = listAt(parentOf(target));
          const [moved] = from.splice(target[target.length-1], 1);
          listAt(f.target).push(moved);
          path = parentOf(target).length ? parentOf(target) : [];
          await run("Verschoben: " + moved.title, () => saveTree("Verschoben: " + moved.title));
        }}));
      menuSheet("Verschieben nach", choices);
    }});

    items.push({ label: "Löschen", danger: true, run: async () => {
      const label = node.title;
      const isEntry = node.type === "pdf" || node.type === "quiz";
      if(!confirm("«" + label + "» löschen?" + (isEntry ? " Die Datei wird ebenfalls entfernt." : ""))) return;
      const file = node.file;
      listAt(parentOf(target)).splice(target[target.length-1], 1);
      path = parentOf(target);
      const extra = isEntry && file ? [{ path: file, remove: true }] : [];
      await run("Gelöscht: " + label, () => saveTree("Gelöscht: " + label, extra));
    }});
  }

  menuSheet(node.title, items);
}

/* Eine Schreibaktion mit Rückmeldung und Neuzeichnen. */
async function run(what, fn){
  const body = $("#sheetBody");
  try{
    document.body.classList.add("busy");
    await fn();
    render();
    flash(what + " · gespeichert");
  }catch(e){
    alert("Fehlgeschlagen: " + e.message + "\n\nDie Seite lädt neu, damit nichts durcheinander gerät.");
    location.reload();
  }finally{
    document.body.classList.remove("busy");
  }
}

function flash(text){
  const el = document.createElement("div");
  el.className = "note ok";
  el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;box-shadow:0 20px 50px rgba(0,0,0,.6)";
  el.textContent = text + " — in etwa einer Minute live.";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* -------------------- Hochladen -------------------- */
$("#addBtn").addEventListener("click", () => {
  if(!path.length){
    alert("Wähle links zuerst einen Ordner. In die Übersicht selbst lässt sich nichts legen.");
    return;
  }
  const here = Sync ? null : null;
  $("#sheetHead").textContent = "Hochladen nach «" + nodeAt(path).title + "»";
  const body = $("#sheetBody"); body.textContent = "";
  body.innerHTML = '<div class="drop" id="drop">PDF, HTML oder JSON hierher ziehen<br>oder klicken zum Auswählen'
    + '<input type="file" id="picker" multiple accept=".pdf,.html,.htm,.json" hidden></div>'
    + '<div class="queue" id="queue"></div>'
    + '<p class="hint">Alte HTML-Prüfungen werden beim Hochladen automatisch in JSON umgewandelt. '
    + 'Titel lassen sich vor dem Speichern noch ändern.</p>'
    + '<button class="btn" id="doUpload" type="button" hidden>Hochladen</button>';

  const drop = body.querySelector("#drop");
  const picker = body.querySelector("#picker");
  const queueEl = body.querySelector("#queue");
  const button = body.querySelector("#doUpload");
  const queue = [];

  drop.addEventListener("click", () => picker.click());
  ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => take([...(e.dataTransfer.files || [])]));
  picker.addEventListener("change", () => { take([...picker.files]); picker.value = ""; });

  async function take(files){
    for(const file of files){
      try{ queue.push(await Admin.prepare(file)); }
      catch(err){ queue.push({ error: err.message, title: file.name }); }
    }
    draw();
  }

  function draw(){
    queueEl.textContent = "";
    queue.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "qrow" + (item.error ? " bad" : "");
      const ico = document.createElement("span");
      ico.className = "qi"; ico.textContent = item.error ? "✕" : (item.kind === "pdf" ? "▤" : "◉");
      const name = document.createElement(item.error ? "span" : "input");
      if(item.error){ name.textContent = item.title; name.style.flex = "1"; }
      else { name.value = item.title; name.addEventListener("input", () => { item.title = name.value; }); }
      const meta = document.createElement("span");
      meta.className = "qm";
      meta.textContent = item.error ? item.error : (item.meta + (item.converted ? " · umgewandelt" : ""));
      const x = document.createElement("button");
      x.className = "qx"; x.type = "button"; x.textContent = "✕";
      x.addEventListener("click", () => { queue.splice(i,1); draw(); });
      row.append(ico, name, meta, x);
      queueEl.appendChild(row);
    });
    button.hidden = !queue.some(q => !q.error);
  }

  button.addEventListener("click", async () => {
    const good = queue.filter(q => !q.error);
    if(!good.length) return;
    button.disabled = true; button.textContent = "Lade hoch …";
    const folder = path.map(i => "x").length;   /* nur zur Lesbarkeit */
    const base = "content/" + (nodeAt([path[0]]).id === "quizzes" ? "quizzes" : "unterlagen") + "/";
    const extra = [];
    good.forEach(item => {
      const file = base + Admin.slug(item.title) + (item.kind === "pdf" ? ".pdf" : ".json");
      extra.push({ path: file, content: item.content });
      listAt(path).push({
        type: item.kind, title: item.title, file,
        meta: item.meta
      });
    });
    try{
      document.body.classList.add("busy");
      await saveTree("Hochgeladen: " + good.map(g => g.title).join(", "), extra);
      sheet.close(); render();
      flash(good.length + (good.length === 1 ? " Datei" : " Dateien") + " hochgeladen");
    }catch(e){
      alert("Fehlgeschlagen: " + e.message);
      location.reload();
    }finally{
      document.body.classList.remove("busy");
      button.disabled = false; button.textContent = "Hochladen";
    }
  });

  sheet.showModal();
});

/* -------------------- Anmeldung -------------------- */
$("#adminBtn").addEventListener("click", () => {
  $("#sheetHead").textContent = "Verwaltung";
  const body = $("#sheetBody"); body.textContent = "";

  if(Admin.enabled()){
    body.innerHTML = '<p class="hint">Angemeldet für <b>' + Admin.repo() + '</b>. '
      + 'Änderungen werden sofort ins Repository geschrieben und sind nach etwa '
      + 'einer Minute auf der Seite sichtbar.</p>'
      + '<button class="btn ghost" id="out" type="button">Abmelden</button>';
    body.querySelector("#out").addEventListener("click", () => {
      Admin.logout(); refreshAdmin(); render(); sheet.close();
    });
    sheet.showModal();
    return;
  }

  body.innerHTML = '<p class="hint">Mit einem GitHub-Token kannst du Unterlagen und Quizzes '
    + 'direkt hier hochladen und Ordner verwalten. Der Token bleibt in diesem Browser.</p>'
    + '<input type="text" id="tok" placeholder="github_pat_…" spellcheck="false" autocapitalize="off">'
    + '<button class="btn" id="in" type="button">Anmelden</button>'
    + '<p class="hint">Token erstellen: GitHub → Settings → Developer settings → '
    + 'Personal access tokens → Fine-grained tokens. Nur dieses eine Repository auswählen, '
    + 'unter Permissions <b>Contents: Read and write</b>.</p>';

  body.querySelector("#in").addEventListener("click", async () => {
    const btn = body.querySelector("#in");
    btn.disabled = true; btn.textContent = "Prüfe …";
    try{
      await Admin.login(body.querySelector("#tok").value);
      refreshAdmin(); render(); sheet.close(); flash("Angemeldet");
    }catch(e){ note(body, e.message, false); }
    finally{ btn.disabled = false; btn.textContent = "Anmelden"; }
  });
  sheet.showModal();
});

/* ==================== Suchfeld ==================== */
const qInput = $("#q");
let qTimer = null;

function clearQuery(){
  query = ""; qInput.value = "";
  $("#searchBox").classList.remove("has");
}

qInput.addEventListener("input", () => {
  $("#searchBox").classList.toggle("has", qInput.value.length > 0);
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = qInput.value; renderStage(); }, 90);
});
qInput.addEventListener("keydown", e => {
  if(e.key === "Escape"){ clearQuery(); renderStage(); qInput.blur(); }
});
$("#qx").addEventListener("click", () => { clearQuery(); renderStage(); qInput.focus(); });

/* Schrägstrich springt ins Suchfeld, wie in vielen Nachschlagewerken. */
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== qInput
     && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)
     && !sheet.open){
    e.preventDefault(); qInput.focus();
  }
});

/* ==================== Start ==================== */
if(CFG.syncEndpoint) Sync.setEndpoint(CFG.syncEndpoint);
Sync.onSync(() => render());

fetch(CFG.contentIndex || "content/index.json", { cache: "no-cache" })
  .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    TREE = data;
    $("#brandTitle").textContent = data.title || "Übungsprüfungen";
    $("#brandSub").textContent = data.subtitle || "ETH Medizin";
    refreshAdmin();
    render();
    if(Sync.configured() && Sync.meta().key) Sync.sync();
  })
  .catch(err => {
    $("#title").textContent = "Inhalt nicht erreichbar";
    $("#sub").textContent = "content/index.json liess sich nicht laden (" + err.message + ").";
    $("#brandSub").textContent = "Fehler";
  });

window.addEventListener("pageshow", () => { if(TREE) render(); });
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
