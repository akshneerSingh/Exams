/* ============================================================================
   Startseite.

   Links die Schiene mit den Abschnitten aus content/index.json, rechts der
   Inhalt des gewählten Ordners. Alles, was hier steht, liegt im Repository und
   ist für jeden sichtbar. Was nicht sichtbar ist: der gelöste Fortschritt —
   der bleibt im Browser des jeweiligen Besuchers.
   ========================================================================== */

:root{
  --bg:#000; --card:#141416; --card-2:#1d1d20; --raised:#2a2a2e;
  --hair:rgba(255,255,255,.08);
  --label:#f5f5f7; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.32);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --mark:#ff9f0a;               /* Markierung beim Auswählen */
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,
         "Helvetica Neue",Helvetica,Arial,sans-serif;
  --rail-w:308px;
  --rail-gap:16px;              /* Abstand der Platte zum Fensterrand */
  --bar-h:54px;                 /* Höhe der Leiste auf dem Telefon */

  /* Federkurven. Nichts läuft gleichförmig: alles schwingt leicht über und
     pendelt sich ein, damit Bewegungen Gewicht haben statt zu rutschen. */
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-soft:cubic-bezier(.34,1.4,.42,1);

  /* Durchscheinendes Material — der Inhalt schimmert verschwommen durch,
     statt hinter einer deckenden Fläche zu verschwinden. */
  --glass:rgba(22,22,24,.62);
  --glass-blur:saturate(180%) blur(28px);
  --lift:0 1px 2px rgba(0,0,0,.28),0 12px 32px rgba(0,0,0,.34);
  --lift-hi:0 2px 4px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.44);
}
/* Helle Fassung. Die Marken bleiben dieselben, nur ihre Werte drehen sich —
   deshalb steht das Aussehen der ganzen Seite in diesen zwölf Zeilen. */
html[data-theme="light"]{
  --glass:rgba(255,255,255,.7);
  --lift:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.08);
  --lift-hi:0 2px 6px rgba(0,0,0,.08),0 18px 42px rgba(0,0,0,.12);
  --bg:#f7f7f9; --card:#ffffff; --card-2:#f2f2f5; --raised:#e8e8ec;
  --hair:rgba(0,0,0,.08);
  --label:#0b0b0c; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.34);
  --blue:#007aff; --green:#28a745; --red:#d70015; --orange:#c76b00;
  --mark:#d97706;
  color-scheme:light;
}
html[data-theme="light"] .rail{background:#fbfbfd}
html[data-theme="light"] .seg button:hover,
html[data-theme="light"] .chip:hover{background:rgba(0,0,0,.05)}
html[data-theme="light"] .search input{background:rgba(0,0,0,.05)}
html[data-theme="light"] .search input:hover{background:rgba(0,0,0,.075)}
html[data-theme="light"] .search input:focus{background:#fff;box-shadow:0 0 0 3.5px rgba(0,122,255,.22)}
html[data-theme="light"] .search .clr{background:rgba(0,0,0,.16)}
html[data-theme="light"] .progress{background:rgba(0,0,0,.09)}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
html[data-theme="light"] .tile{box-shadow:0 1px 2px rgba(0,0,0,.05)}
html[data-theme="light"] dialog{box-shadow:0 30px 80px rgba(0,0,0,.22)}
html[data-theme="light"] .railshow{background:rgba(0,0,0,.07)}
html[data-theme="light"] .btn.ghost{background:rgba(0,0,0,.07)}
html[data-theme="light"] .pick{background:var(--card-2)}
html[data-theme="light"] .qrow{background:var(--card-2)}
html[data-theme="light"] input,html[data-theme="light"] textarea{background:#fff}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--sans);
  font-size:16px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:rgba(10,132,255,.35)}
button,input{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ============ Schiene ============ */
.rail{
  position:fixed;z-index:45;
  top:calc(var(--rail-gap) + env(safe-area-inset-top));
  left:var(--rail-gap);
  bottom:var(--rail-gap);
  width:var(--rail-w);
  display:flex;flex-direction:column;
  padding:18px 12px 12px;
  border:.5px solid var(--hair);
  border-radius:14px;
  background:var(--glass);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  box-shadow:var(--lift);
}
html[data-theme="light"] .rail{background:var(--glass)}
.brand{padding:0 8px;margin-bottom:4px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.018em}
.brand span{display:block;font-size:12px;color:var(--label-3);font-weight:500;
  margin-top:2px;line-height:1.35}
.railtitle{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);padding:0 8px;margin:26px 0 8px}
.seg{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;
  padding-right:2px}
/* Zeile im Baum. Die Einrückung sitzt in einem eigenen Feld links, nicht im
   Innenabstand — dadurch bleibt die Trefferfläche über die volle Breite und
   die Namen stehen sauber untereinander. */
.seg button{
  position:relative;display:flex;align-items:center;gap:7px;width:100%;
  min-height:34px;padding:0 12px 0 6px;
  color:var(--label-2);font-size:14px;font-weight:450;letter-spacing:-.012em;
  border-radius:8px;text-align:left;
  transition:background .16s ease,color .16s ease}
.seg button:active{background:rgba(118,118,128,.26)}
.seg button:hover{background:rgba(118,118,128,.16);color:var(--label)}
.seg button[aria-selected="true"]{background:rgba(10,132,255,.16);color:var(--blue);font-weight:600}
.seg button.picked{background:color-mix(in srgb,var(--mark) 22%,transparent);
  color:var(--mark);font-weight:600}
.seg button.picked .cnt{color:var(--mark);opacity:.8}

/* Leiste über der Auswahl. Erscheint nur, solange etwas markiert ist. */
/* Die Leiste in der schmalen Schiene: Zähler in einer eigenen Zeile, darunter
   drei gleich breite Knöpfe. Nebeneinander brachen die Wörter vorher um und
   «Fertig» rutschte aus dem Bild. */
/* Eine Zeile. Label und drei Knöpfe untereinander liessen die Schiene
   zerrissen aussehen; Symbole statt Wörter passen nebeneinander. */
.selbar{display:flex;align-items:center;gap:1px;margin:0 0 8px;
  padding:4px 4px 4px 9px;border-radius:9px;
  background:rgba(10,132,255,.13);border:.5px solid rgba(10,132,255,.28)}
.selbar .n{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:var(--blue);
  letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.selbar .row{display:flex;gap:1px;flex:none}
.selbar button{flex:none;width:28px;height:28px;display:grid;place-items:center;
  color:var(--blue);border-radius:7px;transition:background .15s ease}
.selbar button svg{width:15px;height:15px;display:block}
.selbar button:hover{background:rgba(10,132,255,.2)}
.selbar button.plain{color:var(--label-2)}
.selbar button.plain:hover{background:rgba(118,118,128,.2)}
.selbar button.danger{color:var(--red)}
.selbar button.danger:hover{background:rgba(255,69,58,.16)}

/* Auswahlmodus: die Karten bekommen ein Kästchen und reagieren auf den Klick
   mit Markieren statt mit Öffnen. */
.card.pickable{cursor:pointer}
.card.chosen{box-shadow:inset 0 0 0 2px var(--mark);
  background:color-mix(in srgb,var(--mark) 9%,transparent)}
.card .tick{flex:none;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--label-3);display:grid;place-items:center;
  font-size:11px;color:transparent;margin-right:2px}
.card.chosen .tick{border-color:var(--mark);background:var(--mark);color:#fff}

/* Werkzeuge zur Auswahl: schweben oben rechts über allem, statt in der
   Schiene zu sitzen. Dort nahmen sie Platz weg und waren am Telefon hinter
   der Schublade unerreichbar. */
.pickbar{position:fixed;z-index:60;
  top:calc(var(--rail-gap) + env(safe-area-inset-top));
  right:var(--rail-gap);
  display:flex;align-items:center;gap:2px;
  padding:6px 6px 6px 14px;border-radius:14px;
  border:.5px solid color-mix(in srgb,var(--mark) 40%,transparent);
  background:var(--glass);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--lift-hi);
  animation:pickIn .3s var(--spring-soft)}
@keyframes pickIn{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
.pickbar .n{margin-right:8px;font-size:13px;font-weight:600;color:var(--mark);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.pickbar button{flex:none;height:32px;padding:0 11px;border-radius:9px;
  color:var(--label);font-size:13.5px;font-weight:500;letter-spacing:-.012em;
  white-space:nowrap;transition:background .15s ease,color .15s ease}
.pickbar button:hover{background:rgba(118,118,128,.24)}
.pickbar button:disabled{opacity:.35;cursor:default}
.pickbar button.danger{color:var(--red)}
.pickbar button.danger:hover{background:rgba(255,69,58,.16)}
.pickbar button.done{width:32px;padding:0;display:grid;place-items:center;color:var(--label-2)}
@media (max-width:860px){
  .pickbar{top:auto;bottom:calc(var(--rail-gap) + env(safe-area-inset-bottom));
    left:var(--rail-gap);right:var(--rail-gap);justify-content:center;
    padding:6px;animation:pickUp .3s var(--spring-soft)}
  .pickbar .n{margin:0 auto 0 8px}
}
@keyframes pickUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Ablegen vom Schreibtisch */
.dropzone{position:fixed;inset:0;z-index:70;display:none;place-items:center;
  background:rgba(10,132,255,.14);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.dropping .dropzone{display:grid}
.dropzone .inner{padding:34px 44px;border-radius:22px;
  border:2px dashed var(--blue);background:var(--card);
  font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center}
.dropzone .inner span{display:block;margin-top:6px;font-size:13.5px;
  font-weight:400;color:var(--label-2)}
.seg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Klapp-Pfeil links vom Namen. Wo es nichts zu klappen gibt, hält ein
   unsichtbarer Platzhalter die Namen trotzdem auf einer Fluchtlinie. */
/* Einrückungsfeld: pro Ebene ein fester Streifen mit einer feinen Führungslinie.
   Ohne sie verliert man bei drei Ebenen die Zuordnung. */
.seg .pad{flex:none;align-self:stretch;position:relative}
.seg .pad::before{content:"";position:absolute;top:3px;bottom:3px;right:9px;
  width:1px;background:var(--hair)}
.seg .pad.root::before{display:none}

/* Aufklapp-Zeiger: schlanker Winkel statt vollflächigem Dreieck. */
.seg .tw{flex:none;width:20px;height:20px;display:grid;place-items:center;
  color:var(--label-3);font-size:11px;border-radius:5px;
  transform:rotate(90deg);
  transition:transform .2s var(--spring),background .15s ease,color .15s ease}
.seg .tw:hover{background:rgba(118,118,128,.28);color:var(--label)}
.seg .tw.closed{transform:rotate(0deg)}
.seg .tw.leaf{visibility:hidden}
.seg .cnt{margin-left:auto;padding-left:10px;font-size:11.5px;font-weight:600;
  color:var(--label-3);font-variant-numeric:tabular-nums}
.seg button[aria-selected="true"] .cnt{color:var(--blue);opacity:.85}
.seg .sect{margin-top:18px;font-weight:600;font-size:14.5px;color:var(--label)}
.seg .sect:first-child{margin-top:0}
.seg .cnt{font-variant-numeric:tabular-nums}
.railfoot{margin-top:auto;padding-top:18px}
.mini{padding:0 8px 12px}
.mini .lab{font-size:11.5px;color:var(--label-3);font-weight:500;display:flex;
  justify-content:space-between;margin-bottom:7px;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .35s ease}
/* Nur noch eine Zeile: ein Zahnrad für alles, was Einstellung ist, und für
   Angemeldete ein Plus. Sechs gleich aussehende Zeilen für sechs sehr
   verschiedene Dinge waren der Grund, warum hier nichts hervorstach. */
.tools{display:flex;gap:6px;padding:0 4px}
.tool{position:relative;width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;color:var(--label-2);font-size:15px;
  transition:background .15s ease,color .15s ease}
.tool:hover{background:rgba(118,118,128,.2);color:var(--label)}
.tool.on{color:var(--blue);background:rgba(10,132,255,.16)}
.tool .lamp{position:absolute;top:5px;right:5px;width:6px;height:6px;margin:0}
.chip{display:flex;align-items:center;gap:8px;width:100%;color:var(--label-2);
  font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:9px;
  text-align:left;transition:background .16s ease,color .16s ease,transform .18s var(--spring-soft)}
.chip:active{transform:scale(.975);transition-duration:.08s}
.chip:hover{background:rgba(118,118,128,.16);color:var(--label)}
.lamp{width:7px;height:7px;border-radius:50%;background:transparent;margin-left:auto;flex:none}
.lamp.ok{background:var(--green)}

/* ============ Bühne ============ */
main{margin-left:calc(var(--rail-w) + var(--rail-gap)*2);padding:46px 28px 80px}
main > article{max-width:760px;margin:0 auto;min-width:0}
.crumb{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:10px;
  display:inline-flex;align-items:center;gap:4px}
h1{font-size:32px;font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:0}
.titlerow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.titlerow h1{margin-right:6px}
/* Zwei beschriftete Knöpfe statt zweier Kreise: bei Symbolen allein muss man
   raten, welcher welcher ist. */
/* Nur Symbole. Gezeichnet statt getippt, weil Textzeichen wie ＋ und ↑ je
   nach Schrift unterschiedlich gross und schief sitzen. */
.addpill{flex:none;display:grid;place-items:center;
  width:36px;height:36px;border-radius:50%;
  color:var(--blue);background:rgba(10,132,255,.14);
  transition:background .15s ease,transform .18s var(--spring-soft)}
.addpill svg{width:20px;height:20px;display:block}
.addpill:hover{background:rgba(10,132,255,.24)}
.addpill:active{transform:scale(.92)}
/* Andere Form, andere Farbe: die beiden sollen sich nicht ähneln. */
.addpill--file{color:var(--label-2);background:rgba(118,118,128,.18)}
.addpill--file:hover{background:rgba(118,118,128,.3);color:var(--label)}
.addpill--edit{color:var(--label-2);background:rgba(118,118,128,.18)}
.addpill--edit:hover{background:rgba(118,118,128,.3);color:var(--label)}
.addpill--edit.on{color:#fff;background:var(--blue)}

/* Auswahlleiste in der Bühne — dort, wo die Karten liegen. In der Schiene
   allein wäre sie am Telefon hinter der Schublade unerreichbar. */
.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:0 0 12px;padding:10px 12px;border-radius:12px;
  background:rgba(10,132,255,.12);border:.5px solid rgba(10,132,255,.28)}
.stagebar .n{flex:1;min-width:120px;font-size:13.5px;font-weight:600;color:var(--blue)}
.stagebar button{font-size:13.5px;font-weight:600;color:var(--blue);
  padding:6px 10px;border-radius:8px;transition:background .15s ease}
.stagebar button:hover{background:rgba(10,132,255,.18)}
.stagebar button.danger{color:var(--red)}
.stagebar button.danger:hover{background:rgba(255,69,58,.16)}
.stagebar button.plain{color:var(--label-2)}
.clipbar{background:rgba(118,118,128,.14);border-color:var(--hair)}
.clipbar .n{color:var(--label-2)}
.clipbar button{color:var(--blue)}
.clipbar button:hover{background:rgba(10,132,255,.16)}
.tool svg{width:18px;height:18px;display:block}
.sub{font-size:14px;color:var(--label-3);margin-top:6px;max-width:56ch}
.sectitle{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin:34px 0 10px}

/* ============ Fortsetzen als Kachelfeld ============
   Statt einer breiten Karte für genau eine Prüfung: quadratische Kacheln wie
   Widgets, mehrere nebeneinander. Der Ring zeigt den Anteil, ohne dass man
   eine Zahl lesen muss. */

.resumehead{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.resumehead .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--label-3)}
.resumehead .act{margin-left:auto;color:var(--label-3);font-size:12.5px;
  font-weight:500;padding:4px 8px;border-radius:7px;
  transition:background .15s ease,color .15s ease}
.resumehead .act:hover{background:rgba(118,118,128,.18);color:var(--label)}

.tilegrid{display:grid;gap:10px;margin-bottom:30px;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}

.wtile{position:relative;display:flex;flex-direction:column;
  aspect-ratio:1;min-width:0;padding:16px;
  border:.5px solid var(--hair);border-radius:22px;
  background:var(--card);color:inherit;text-align:left;
  transition:transform .24s var(--spring-soft),box-shadow .24s var(--spring),
             border-color .16s ease}
.wtile:hover{transform:translateY(-3px);box-shadow:var(--lift-hi);
  border-color:rgba(10,132,255,.4)}
.wtile:active{transform:translateY(-1px) scale(.99);transition-duration:.09s}
.wtile h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.018em;
  line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wtile .foot{margin-top:auto;display:flex;align-items:flex-end;gap:10px}
.wtile .meta{flex:1;min-width:0;font-size:12px;color:var(--label-3);
  letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.wtile .meta b{display:block;color:var(--label-2);font-weight:500;font-size:12.5px}

/* Ring: zwei Kreise übereinander, der obere wird über die Strichlücke
   aufgezogen. Kein Bild, keine Bibliothek. */
.ring{flex:none;width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .bg{stroke:var(--fill-strong,rgba(118,118,128,.22))}
.ring .fg{stroke:var(--blue);transition:stroke-dashoffset .5s var(--spring)}
.wtile.done .ring .fg{stroke:var(--green)}
.ringwrap{position:relative;flex:none;width:46px;height:46px}
.ringwrap span{position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--label-2);
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.ringwrap span::after{content:"%";font-size:9px;font-weight:600;
  color:var(--label-3);margin-left:1px;align-self:center}
.ringwrap span{display:flex;align-items:center;justify-content:center}

.wtile .off{position:absolute;top:8px;right:8px;width:26px;height:26px;
  border-radius:50%;display:grid;place-items:center;
  color:var(--label-3);font-size:11px;opacity:0;
  transition:opacity .15s ease,background .15s ease,color .15s ease}
.wtile:hover .off{opacity:1}
.wtile .off:hover{background:rgba(118,118,128,.24);color:var(--label)}
@media (hover:none){ .wtile .off{opacity:1} }

.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.card{display:flex;align-items:center;gap:12px;background:var(--card);
  border:.5px solid transparent;border-radius:14px;padding:15px 16px;
  min-width:0;text-align:left;
  transform:translateZ(0);
  transition:transform .22s var(--spring-soft),box-shadow .22s var(--spring),
             background .16s ease,border-color .16s ease}
/* Zwei Pixel Hub und ein Schatten — der Unterschied zwischen Bild und
   Oberfläche liegt genau hier, nicht in grösseren Effekten. */
.card:hover{background:var(--card-2);transform:translateY(-2px);
  box-shadow:var(--lift);border-color:var(--hair)}
.card:active{transform:translateY(0) scale(.994);box-shadow:none;
  transition-duration:.09s}
.card .ico{flex:none;width:26px;text-align:center;color:var(--label-3);font-size:15px}
.card .body{flex:1 1 0;min-width:0;max-width:100%;text-align:left}
.card h3{font-size:16.5px;font-weight:600;letter-spacing:-.016em;margin:0;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3,.card .meta{display:block;max-width:100%}
.card .meta{font-size:13px;color:var(--label-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .body,.card .foot{display:block;max-width:100%}
.card .foot{display:flex}
.resume h2,.resume .where{overflow-wrap:break-word}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:11px;min-width:0}
.card .foot .progress{flex:1;max-width:200px}
.card .stat{font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums}
.card .stat.done{color:var(--green)}
.chev{flex:none;color:var(--label-3);font-size:17px}

.empty{background:var(--card);border-radius:14px;padding:26px 20px;text-align:center}
.empty b{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.empty p{margin:0;font-size:14px;color:var(--label-3);line-height:1.5}

/* ============ Suche ============ */
/* Runde Kapsel wie in den Systemprogrammen: gefüllte Fläche ohne Rahmen,
   beim Tippen leicht heller, im Fokus ein weicher Ring statt einer Kante. */
.search{position:relative;margin:0 8px 4px}
.search input{
  width:100%;height:32px;padding:0 30px 0 31px;
  border:0;border-radius:999px;
  background:rgba(118,118,128,.16);
  color:var(--label);font-size:13.5px;font-family:var(--sans);
  letter-spacing:-.011em;
  transition:background .18s ease,box-shadow .18s ease}
.search input::placeholder{color:var(--label-3)}
.search input::-webkit-search-decoration,
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:hover{background:rgba(118,118,128,.22)}
.search input:focus{
  outline:none;background:rgba(118,118,128,.26);
  box-shadow:0 0 0 3.5px rgba(10,132,255,.28)}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--label-3);font-size:13px;pointer-events:none;transition:color .18s}
.search input:focus ~ .mag{color:var(--label-2)}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%) scale(.7);
  width:22px;height:22px;border-radius:50%;color:var(--label-3);font-size:10px;
  opacity:0;pointer-events:none;display:grid;place-items:center;
  background:rgba(118,118,128,.35);
  transition:opacity .15s ease,transform .15s ease}
.search.has .clr{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.search .clr:hover{background:rgba(118,118,128,.55);color:var(--label)}

/* ============ Schiene ein- und ausklappen ============ */
.railtoggle{position:absolute;top:calc(18px + env(safe-area-inset-top));right:10px;
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--label-3);font-size:14px;transition:.15s}
.railtoggle:hover{background:rgba(118,118,128,.2);color:var(--label)}
.rail{transition:transform .42s var(--spring),opacity .28s ease}
main{transition:margin-left .42s var(--spring)}
body.rail-off .rail{transform:translateX(calc(-100% - var(--rail-gap)*2));opacity:0}
body.rail-off main{margin-left:0}
.railshow{position:fixed;top:calc(16px + env(safe-area-inset-top));left:14px;z-index:46;
  width:32px;height:32px;border-radius:9px;display:none;place-items:center;
  color:var(--label-2);background:rgba(118,118,128,.2);font-size:15px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.railshow:hover{color:var(--label);background:rgba(118,118,128,.32)}
body.rail-off .railshow{display:grid}

/* ============ Ziehen und Ablegen ============ */
.card[draggable="true"],.seg button[draggable="true"]{cursor:grab}
.dragging{opacity:.4}
.card.into{box-shadow:inset 0 0 0 2px var(--blue);background:rgba(10,132,255,.1)}
.seg button.into{box-shadow:inset 0 0 0 2px var(--blue)}
.hintline{font-size:12.5px;color:var(--label-3);margin:0 0 10px}
.grouphead{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin:22px 0 8px}
.grouphead:first-child{margin-top:0}

/* ============ Startseite ============ */
.hero{margin-bottom:8px}
#lead{font-size:17px;line-height:1.55;color:var(--label-2);
  margin:14px 0 26px;max-width:62ch;white-space:pre-line}
.hero .lead:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tile{display:block;width:100%;background:var(--card);
  border:.5px solid transparent;border-radius:18px;padding:22px;
  min-width:0;text-align:left;color:inherit;
  transition:transform .26s var(--spring-soft),box-shadow .26s var(--spring),
             background .16s ease,border-color .16s ease}
.tile:hover{background:var(--card-2);transform:translateY(-3px);
  box-shadow:var(--lift-hi);border-color:var(--hair)}
.tile:active{transform:translateY(-1px) scale(.995);transition-duration:.09s}
.tile .ti{font-size:19px;color:var(--label-3);margin-bottom:12px}
.tile h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.tile p{margin:6px 0 0;font-size:13.5px;color:var(--label-3);line-height:1.5}
.tile .n{margin-top:14px;font-size:12.5px;color:var(--label-3);
  font-variant-numeric:tabular-nums}

/* ============ Fusszeile und Rechtliches ============ */
.railfoot .legal{display:flex;gap:12px;padding:14px 6px 2px;flex-wrap:wrap}
.railfoot .legal a{font-size:11.5px;color:var(--label-3);transition:color .15s}
.railfoot .legal a:hover{color:var(--label-2)}
.railfoot .legal .ver{margin-left:auto;font-size:11px;color:var(--label-3);
  font-variant-numeric:tabular-nums}
.brandlink{display:block;width:100%;text-align:left;padding:0 8px;
  border-radius:8px;transition:background .15s}
.brandlink:hover{background:rgba(118,118,128,.14)}
.prose{max-width:62ch}
.prose h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:30px 0 8px}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 12px;font-size:15.5px;line-height:1.6;color:var(--label-2)}
.prose a{color:var(--blue)}
.prose ul{margin:0 0 12px;padding-left:20px;color:var(--label-2);
  font-size:15.5px;line-height:1.6}
.prose li{margin-bottom:5px}
.prose .small{font-size:13.5px;color:var(--label-3)}

/* ============ Auswahlmenüs statt Ordnerkarten ============ */
.picker{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.pickfield{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 190px}
.pickfield span{font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--label-3)}
.pickfield select{
  appearance:none;-webkit-appearance:none;
  width:100%;min-height:42px;padding:0 34px 0 14px;
  border:.5px solid var(--hair);border-radius:12px;
  background:var(--card);color:var(--label);
  font-family:var(--sans);font-size:15.5px;font-weight:500;letter-spacing:-.015em;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8a8f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:17px;
  transition:border-color .15s ease,background-color .15s ease}
.pickfield select:hover{background-color:var(--card-2)}
.pickfield select:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.pickfield select:disabled{opacity:.45}

/* ============ Verwaltung ============ */
.rowbtn{flex:none;width:34px;height:34px;border-radius:50%;color:var(--label-3);
  font-size:13px;letter-spacing:.04em;transition:.15s}
.rowbtn:hover{background:rgba(118,118,128,.2);color:var(--label)}
.seg .kebab{flex:none;width:20px;text-align:center;color:var(--label-3);font-size:11px;
  letter-spacing:.04em;opacity:0;transition:opacity .15s}
.seg button:hover .kebab,.seg button[aria-selected="true"] .kebab{opacity:1}
.drop{border:1.5px dashed var(--hair);border-radius:14px;padding:26px 18px;
  text-align:center;color:var(--label-3);font-size:14px;transition:.15s}
.drop.over{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.07)}
.queue{display:grid;gap:6px}
.qrow{display:flex;align-items:center;gap:10px;background:var(--card-2);
  border-radius:10px;padding:9px 11px;min-width:0}
.qrow .qi{flex:none;color:var(--label-3);font-size:13px;width:18px;text-align:center}
.qcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.qrow input{width:100%;min-width:0;background:transparent;border:0;border-radius:0;
  padding:2px 0;font-size:14.5px;font-family:var(--sans);letter-spacing:-.012em}
.qf{font-size:11.5px;color:var(--label-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.qrow .qm{flex:none;font-size:12px;color:var(--label-3);white-space:nowrap}
.qrow .qx{flex:none;color:var(--label-3);font-size:15px;width:22px}
.qrow.bad{background:rgba(255,69,58,.12)}
.qrow.bad .qm{color:var(--red)}
.busy{opacity:.5;pointer-events:none}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;
  border-radius:11px;background:var(--card-2);text-align:left;font-size:15px;
  letter-spacing:-.012em;
  transition:background .15s ease,transform .18s var(--spring-soft)}
.pick:hover{background:var(--raised)}
.pick:active{transform:scale(.985);transition-duration:.08s}
.pick.danger{color:var(--red)}

/* ============ Blatt ============ */
dialog{width:min(460px,calc(100vw - 28px));padding:0;border:.5px solid var(--hair);
  border-radius:20px;background:var(--card);color:var(--label);
  box-shadow:0 40px 100px rgba(0,0,0,.7)}
dialog[open]{animation:sheetIn .34s var(--spring-soft)}
@keyframes sheetIn{
  from{opacity:0;transform:translateY(14px) scale(.97)}
  to{opacity:1;transform:none}
}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-head{padding:20px 20px 0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.sheet-body{padding:16px 20px;display:grid;gap:12px;max-height:66vh;overflow-y:auto}
.sheet-foot{padding:0 20px 20px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border-radius:100px;
  padding:12px 24px;font-size:15.5px;font-weight:600;letter-spacing:-.012em;
  text-align:center;
  transition:transform .2s var(--spring-soft),opacity .15s ease,background .15s ease}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:active{transform:scale(.97);transition-duration:.08s}
.btn.ghost{background:rgba(118,118,128,.24);color:var(--label)}
.hint{font-size:13.5px;color:var(--label-3);line-height:1.5}
.code{display:block;padding:14px;border-radius:12px;background:#000;
  border:.5px solid var(--hair);text-align:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;
  letter-spacing:.08em;word-break:break-all;color:var(--label)}
input[type=text]{width:100%;padding:11px 13px;border:.5px solid var(--hair);
  border-radius:10px;background:#000;font-size:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.note{padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.45}
.note.ok{background:rgba(48,209,88,.14);color:var(--green)}
.note.bad{background:rgba(255,69,58,.14);color:var(--red)}

/* ============ Bewegung ============
   Eine gemeinsame Kurve für alles: schnell los, weich aus. Das ist die
   Federung, die Fenster und Blätter in den Systemprogrammen benutzen.

   Die Einzugsbewegung läuft nur bei einem echten Ortswechsel — sonst würde
   jeder Abgleich im Hintergrund die halbe Seite neu einfliegen lassen.
   ================================================== */
:root{
  --spring:cubic-bezier(.32,.72,0,1);
  --quick:cubic-bezier(.25,.46,.45,.94);
}

@keyframes rise{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:none}
}
@keyframes settle{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
@keyframes sheetIn{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

/* Gestaffelter Einzug: jede Karte startet 34ms nach der vorigen. */
.enter > .card,
.enter > .tiles > .tile,
.enter > .resume,
.enter > .prose,
.enter > .grouphead{
  animation:rise .42s var(--spring) backwards;
  animation-delay:calc(var(--i,0) * 34ms);
}
.enter-head h1,.enter-head .sub,.enter-head #lead,.enter-head .crumb{
  animation:settle .38s var(--spring) backwards}
.enter-head .sub{animation-delay:40ms}
.enter-head #lead{animation-delay:60ms}

/* Karten heben sich beim Überfahren leicht an und geben beim Tippen nach. */
.card,.tile{
  transition:background .18s var(--quick),
             transform .22s var(--spring),
             box-shadow .22s var(--quick);
  will-change:transform}
@media (hover:hover){
  .card:hover,.tile:hover{transform:translateY(-2px)}
  .card:hover{box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .tile:hover{box-shadow:0 14px 34px rgba(0,0,0,.32)}
  html[data-theme="light"] .card:hover{box-shadow:0 8px 22px rgba(0,0,0,.09)}
  html[data-theme="light"] .tile:hover{box-shadow:0 12px 30px rgba(0,0,0,.1)}
  .resume:hover{transform:translateY(-2px)}
}
.card:active,.tile:active{transform:scale(.988);transition-duration:.09s}
.resume{transition:transform .22s var(--spring),border-color .18s var(--quick)}
.resume:active{transform:scale(.992)}

/* Der Balken wächst in seine Länge, statt fertig dazustehen. */
.progress-fill{transition:width .6s var(--spring)}

/* Blatt und Verdunklung */
dialog{animation:sheetIn .34s var(--spring)}
dialog::backdrop{animation:fadeIn .24s var(--quick)}
.pick,.btn,.chip,.seg button,.linkbtn,.mb-btn{transition:background .16s var(--quick),
  color .16s var(--quick),transform .16s var(--spring)}
.pick:active,.btn:active{transform:scale(.985)}

/* Klapp-Pfeil und Suchfeld schwingen mit derselben Kurve. */
.seg .tw{transition:transform .24s var(--spring),background .15s,color .15s}
.search input{transition:background .18s var(--quick),box-shadow .22s var(--spring)}

@media (prefers-reduced-motion:reduce){
  .enter > *,.enter-head *{animation:none!important}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ Handy-Leiste ============ */
.mobilebar{display:none;position:sticky;top:0;z-index:44;
  align-items:center;gap:6px;padding:8px 10px;
  padding-top:calc(8px + env(safe-area-inset-top));
  background:transparent;border-bottom:.5px solid transparent;
  transition:background .22s ease,border-color .22s ease,
             -webkit-backdrop-filter .22s ease,backdrop-filter .22s ease}
/* Erst wenn Inhalt darunter durchläuft, bekommt die Leiste Material und
   Trennlinie. Oben steht sie unsichtbar über der Seite. */
body.scrolled .mobilebar{
  background:var(--glass);border-bottom-color:var(--hair);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur)}
.mb-btn{width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;
  color:var(--label-2);font-size:17px;transition:.15s}
.mb-btn:active{background:rgba(118,118,128,.24)}
.mb-title{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:600;
  letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.42);
  opacity:0;pointer-events:none;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  transition:opacity .32s var(--spring)}

/* ============ schmal ============ */
@media (max-width:860px){
  /* Auf dem Telefon fährt die Schiene von oben herunter, aus der Leiste
     heraus — wie das Auswahlfeld auf Apples Seite. Das passt zum Daumen:
     die Hand liegt unten, der Blick geht nach oben, und der Inhalt bleibt
     an seinem Platz statt seitlich wegzurutschen. */
  .mobilebar{display:flex}
  .railtoggle,.railshow{display:none!important}
  .brand{display:none}          /* der Titel steht schon in der Leiste */

  .rail{
    top:calc(env(safe-area-inset-top) + var(--bar-h));
    left:var(--rail-gap); right:var(--rail-gap);
    bottom:auto; width:auto; max-width:none;
    max-height:min(72dvh,620px);
    padding:14px 12px 12px;
    border-radius:18px;
    transform:translateY(calc(-100% - var(--bar-h) - var(--rail-gap)));
    opacity:0;
    overflow-y:auto;
    box-shadow:var(--lift-hi);
    transition:transform .46s var(--spring),opacity .24s ease}
  body.drawer .rail{transform:none;opacity:1}
  body.drawer .scrim{opacity:1;pointer-events:auto}
  body.drawer{overflow:hidden}
  body.rail-off .rail{transform:translateY(calc(-100% - var(--bar-h) - var(--rail-gap)))}

  /* Der Verdunkelungsschleier beginnt unter der Leiste, damit sie bedienbar
     bleibt und man das Schliesskreuz noch trifft. */
  .scrim{top:calc(env(safe-area-inset-top) + var(--bar-h))}

  /* Das Hamburger-Zeichen wird beim Öffnen zum Kreuz. */
  #drawerBtn{font-size:19px;transition:transform .3s var(--spring)}
  body.drawer #drawerBtn{transform:rotate(90deg)}

  /* Im Blatt scrollt die ganze Spalte. Die Fusszeile darf deshalb nicht mehr
     an den unteren Rand geheftet sein — sonst steht sie über dem Baum, statt
     ihm zu folgen. */
  /* Der Baum muss seine volle Höhe einnehmen dürfen. Als Flex-Element mit
     min-height:0 blieb sein Kasten kurz, während die Zeilen darüber
     hinausragten — daher lagen sie auf der Fusszeile. */
  .seg{overflow:visible;flex:0 0 auto;min-height:auto}
  /* Fortschrittsbalken und Werkzeuge sind hier fehl am Platz: das Zahnrad
     steht oben rechts in der Leiste, und der Balken gehört auf die Seite,
     nicht in die Navigation. */
  .mini,.tools{display:none}
  .railfoot{flex:0 0 auto;margin-top:14px;padding-top:12px;
    border-top:.5px solid var(--hair)}

  main{margin-left:0;padding:20px 16px 60px;width:100%;min-width:0}
  h1{font-size:26px}
  .titlerow{flex-wrap:wrap}
  .card{padding:14px}
  .card .chev{display:none}
  .card .foot .progress{max-width:none}
  .resume .row{flex-wrap:wrap}
  .resume .go{width:100%;text-align:center}
  .tiles{grid-template-columns:minmax(0,1fr)}
  dialog{width:min(460px,calc(100vw - 24px))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .card:hover,.tile:hover,.resume:hover{transform:none}
}
</style>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="admin.js"></script>

<body>

<button class="railshow" id="railShow" type="button" title="Seitenleiste einblenden (⌘B)" aria-label="Seitenleiste einblenden">⊞</button>

<header class="mobilebar">
  <button class="mb-btn" id="drawerBtn" type="button" aria-label="Menü" aria-expanded="false">☰</button>
  <div class="mb-title" id="mbTitle">Übungsprüfungen</div>
  <button class="mb-btn" id="mbSettings" type="button" aria-label="Einstellungen">⚙</button>
</header>
<div class="scrim" id="scrim"></div>

<aside class="rail">
  <button class="railtoggle" id="railToggle" type="button" title="Seitenleiste ausblenden (⌘B)" aria-label="Seitenleiste ausblenden">⊟</button>
  <button class="brand brandlink" id="brandHome" type="button" title="Zur Startseite">
    <b id="brandTitle">Übungsprüfungen</b><span id="brandSub">wird geladen …</span>
  </button>
  <div class="search" id="searchBox">
    <span class="mag" aria-hidden="true">⌕</span>
    <input type="search" id="q" placeholder="Suchen" spellcheck="false"
           autocapitalize="off" autocorrect="off" aria-label="Suchen">
    <button class="clr" id="qx" type="button" aria-label="Suche leeren">✕</button>
  </div>
  <div class="railtitle">Bereiche</div>
  <nav class="seg" id="nav"></nav>
  <div class="railfoot">
    <div class="mini" id="mini" hidden>
      <div class="lab"><span>Beantwortet</span><span id="ratio">0 / 0</span></div>
      <div class="progress"><div class="progress-fill" id="pfill"></div></div>
    </div>
    <div class="tools">
      <button class="tool" id="gearBtn" type="button" title="Einstellungen" aria-label="Einstellungen">

              title="Neuer Ordner" aria-label="Neuer Ordner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.6A1.6 1.6 0 0 1 4.6 6h3.9c.53 0 1.03.26 1.33.7l.87 1.3h8.7A1.6 1.6 0 0 1 21 9.6v7.8A1.6 1.6 0 0 1 19.4 19H4.6A1.6 1.6 0 0 1 3 17.4z"/><path d="M12 11.4v4.2M9.9 13.5h4.2"/></svg></button>

  <div class="sheet-head" id="sheetHead"></div>

<script>
(() => {
"use strict";

/* Sichtbare Fassung. Steht in den Einstellungen, damit man auf einen Blick
   sieht, ob die hochgeladene Datei wirklich die ausgelieferte ist. */
const APP_VERSION = "39";
const CFG = window.APP_CONFIG || {};
const PROG = "pruefung:progress:";
const $ = s => document.querySelector(s);

let TREE = null;      /* Abschnitte aus content/index.json */
let path = [];        /* Indexpfad in den Baum, z.B. [0,1,0] */

/* ==================== Baum ==================== */
function nodeAt(p){
  let node = { children: TREE ? TREE.sections : [] };
  p.forEach(i => { node = (node.children || [])[i]; });
  return node;
}
function isFolder(n){ return n && (n.type === "folder" || Array.isArray(n.sections) || (!n.type && n.children)); }
function countQuiz(n){
  if(!n) return 0;
  if(n.type === "quiz" || n.type === "pdf") return 1;
  return (n.children || []).reduce((s,c) => s + countQuiz(c), 0);
}
function quizzesIn(n, out){
  out = out || [];
  if(!n) return out;
  if(n.type === "quiz") out.push(n);
  (n.children || []).forEach(c => quizzesIn(c, out));
  return out;
}
function allQuizzes(){
  return (TREE ? TREE.sections : []).reduce((a,s) => a.concat(quizzesIn(s)), []);
}

/* ==================== Fortschritt ==================== */
const rd = (k,f) => { try{ const v = localStorage.getItem(k); return v===null?f:JSON.parse(v); }catch(_){ return f; } };
const idFor = q => "file:" + q.file;
function progressOf(q){
  const s = rd(PROG + idFor(q), null);
  if(!s || !Array.isArray(s.rounds) || !s.rounds[0]) return { done:0, total:0, last:null };
  const r0 = s.rounds[0];
  const r = s.rounds[s.round || 0] || r0;
  return {
    done: Object.keys(r0.answers || {}).length,
    total: s.questionCount || 0,
    last: r && Number.isInteger(r.lastQ) ? r.lastQ : null
  };
}

/* ====================================================================
   Suche

   Bei ein paar hundert Einträgen ist der einfache Durchlauf durch alle das
   schnellste Verfahren — unter einer Millisekunde. Sortiert wird nicht die
   Datenbasis, sondern die Trefferliste: Titelanfang schlägt Titelmitte,
   Titel schlägt Ordnername.

   Umlaute werden vorher aufgelöst, damit «prufung» auch «Prüfung» findet.
   ==================================================================== */

let query = "";

function fold(text){
  return String(text || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "ss");
}

function search(term){
  const q = fold(term).trim();
  if(q.length < 2) return { groups: [], total: 0 };
  const hits = [];

  const walk = (node, trail, target) => {
    (node.children || []).forEach((child, i) => {
      const here = target.concat(i);
      const name = fold(child.title);
      const where = trail.join(" › ");
      let score = -1;
      if(name.startsWith(q)) score = 0;
      else if(name.includes(q)) score = 1;
      else if(fold(child.meta).includes(q) || fold(child.blurb).includes(q)) score = 2;
      else if(fold(where).includes(q)) score = 3;

      if(score >= 0) hits.push({ node: child, target: here, where, score });
      if(child.children) walk(child, trail.concat(child.title), here);
    });
  };

  TREE.sections.forEach((section, si) => {
    /* Die Bereiche selbst sind ebenfalls Treffer — «quizzes» soll den
       Bereich finden, nicht nur seinen Inhalt. */
    const name = fold(section.title);
    let score = -1;
    if(name.startsWith(q)) score = 0;
    else if(name.includes(q)) score = 1;
    else if(fold(section.blurb).includes(q)) score = 2;
    if(score >= 0) hits.push({ node: section, target: [si], where: "Bereich", score });
    walk(section, [section.title], [si]);
  });

  /* Innerhalb einer Gruppe: erst nach Güte, dann alphabetisch. */
  const byScore = (a, b) => a.score !== b.score
    ? a.score - b.score
    : a.node.title.localeCompare(b.node.title, "de");

  const folders = hits.filter(h => !h.node.file).sort(byScore);
  const entries = hits.filter(h => h.node.file).sort(byScore);

  /* Welche Gruppe zuerst kommt, entscheidet ihr bester Treffer. Sucht man
     «Biochemie», ist der gleichnamige Ordner ein Namenstreffer, die Dateien
     darin nur Pfadtreffer — dann gehört der Ordner nach oben. Vorher standen
     Einträge immer vorn, und der gesuchte Ordner rutschte auf Platz fünf. */
  const best = list => list.length ? list[0].score : 99;
  const foldersFirst = best(folders) <= best(entries);

  return {
    groups: foldersFirst
      ? [{ label: "Ordner", items: folders }, { label: "Unterlagen und Quizzes", items: entries }]
      : [{ label: "Unterlagen und Quizzes", items: entries }, { label: "Ordner", items: folders }],
    total: folders.length + entries.length
  };
}

/* Jeder Ortswechsel läuft über diesen Weg. Vorher setzte jeder Klick nur
   `path`, und wer im Impressum stand, blieb dort hängen, weil `page` gesetzt
   blieb und renderStage es zuerst abfragt. */
function goTo(target){
  page = null;
  path = target;
  revealPath(target);
  if(location.hash) history.replaceState(null, "", location.pathname + location.search);
  drawer(false);
  render();
}

/* ==================== Zeichnen ==================== */
/* ==================== Sortierung ====================
   Eine Einstellung für alle Ordner. Sie ändert nur die Anzeige, nicht die
   gespeicherte Reihenfolge — so lässt sie sich jederzeit zurückstellen, ohne
   dass am Inhaltsverzeichnis etwas geschrieben wird.

   Ordner stehen immer vor Einträgen; alles andere wäre beim Durchklicken
   verwirrend. */

const SORT_KEY = "pruefung:sort";
const SORTS = {
  manuell: { label: "Wie angelegt", cmp: null },
  az:      { label: "Name A → Z", cmp: (a,b) => a.title.localeCompare(b.title, "de") },
  za:      { label: "Name Z → A", cmp: (a,b) => b.title.localeCompare(a.title, "de") }
};
let sortMode = "manuell";
try { if(SORTS[localStorage.getItem(SORT_KEY)]) sortMode = localStorage.getItem(SORT_KEY); } catch(_) {}

/* Liefert Paare aus Kind und seinem echten Index. Der Index muss der der
   ungeordneten Liste bleiben, sonst zeigen alle Pfade ins Leere. */
function ordered(list){
  const pairs = (list || []).map((child, i) => ({ child, i }));
  const folder = p => p.child.type === "folder" || !p.child.file;
  const cmp = SORTS[sortMode].cmp;
  return pairs.sort((a, b) => {
    const fa = folder(a) ? 0 : 1, fb = folder(b) ? 0 : 1;
    if(fa !== fb) return fa - fb;
    if(!cmp) return a.i - b.i;
    return cmp(a.child, b.child);
  });
}

/* ==================== Fortschritt anzeigen ====================
   Zwei getrennte Schalter, weil es zwei verschiedene Wünsche sind: der eine
   blendet jede Fortschrittsanzeige aus, der andere nur die grosse
   Fortsetzen-Karte auf der Startseite. */

const SHOW_KEY = "pruefung:show-progress";
const RESUME_KEY = "pruefung:show-resume";
let showProgress = true, showResume = true;
try {
  showProgress = localStorage.getItem(SHOW_KEY) !== "off";
  showResume = localStorage.getItem(RESUME_KEY) !== "off";
} catch(_) {}

function setShow(key, value){
  try { localStorage.setItem(key, value ? "on" : "off"); } catch(_) {}
  if(key === SHOW_KEY) showProgress = value; else showResume = value;
  render();
}

function progressSheet(){
  menuSheet("Fortschritt", [
    { label: "Fortschritt anzeigen" + (showProgress ? "   ✓" : ""),
      run: () => setShow(SHOW_KEY, !showProgress) },
    { label: "Fortsetzen-Kacheln anzeigen" + (showResume ? "   ✓" : ""),
      run: () => setShow(RESUME_KEY, !showResume) }
  ]);
}

function sortSheet(){
  menuSheet("Sortierung", Object.keys(SORTS).map(key => ({
    label: SORTS[key].label + (sortMode === key ? "   ✓" : ""),
    run: () => {
      sortMode = key;
      try { localStorage.setItem(SORT_KEY, key); } catch(_) {}
      render();
    }
  })));
}

/* ==================== Auf- und zugeklappte Ordner ====================
   Gemerkt wird, was zugeklappt ist — nicht, was offen ist. So bleiben neu
   hinzugekommene Ordner sichtbar, statt still zuzubleiben. */

const opened = new Set();   /* im schrittweisen Modus von Hand aufgeklappt */

const FOLD_KEY = "pruefung:folded";
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem(FOLD_KEY) || "[]")); } catch(_) {}

const foldId = target => target.join(".");
function saveFolds(){
  try { localStorage.setItem(FOLD_KEY, JSON.stringify([...folded])); } catch(_) {}
}
function toggleFold(target){
  if(treeMode === "focus"){
    const id = foldId(target);
    if(opened.has(id)) opened.delete(id); else opened.add(id);
    renderRail();
    return;
  }
  const id = foldId(target);
  if(folded.has(id)) folded.delete(id); else folded.add(id);
  saveFolds();
  renderRail();
}
/* Ein Ordner ist verborgen, wenn irgendein Vorfahre zugeklappt ist. */
/* Zwei Arten, den Baum zu zeigen.

   «Schrittweise» (Voreinstellung) blendet nur ein, was auf dem Weg liegt:
   die Bereiche, die Kinder des Bereichs, in dem du stehst, und so weiter
   eine Ebene nach unten. Bei Mock Exams heisst das erst das Jahr, dann das
   Semester, dann die Fächer — statt fünf Ebenen gleichzeitig, was in einer
   schmalen Spalte unlesbar wird.

   «Ganzer Baum» ist das alte Verhalten mit den Klapp-Pfeilen. */

const TREE_KEY = "pruefung:tree";
let treeMode = "focus";
try { if(localStorage.getItem(TREE_KEY) === "full") treeMode = "full"; } catch(_) {}

function setTreeMode(mode){
  treeMode = mode;
  try { localStorage.setItem(TREE_KEY, mode); } catch(_) {}
  render();
}

/* Liegt `a` auf dem Weg zu `b` (oder ist es dasselbe)? */
function onPath(a, b){
  return a.length <= b.length && a.every((v, i) => b[i] === v);
}

function hidden(target){
  if(treeMode === "focus"){
    /* Bereiche immer. Sonst nur, wenn der Elternordner auf dem aktuellen
       Weg liegt — dadurch steht immer genau eine Ebene zur Wahl. */
    if(target.length <= 1) return false;
    const parent = target.slice(0, -1);
    if(onPath(parent, path)) return false;
    /* Von Hand aufgeklappte Äste bleiben sichtbar. */
    return !opened.has(target.slice(0, -1).join("."));
  }
  for(let i = 1; i < target.length; i += 1){
    if(folded.has(target.slice(0, i).join("."))) return true;
  }
  return false;
}
/* Beim Navigieren die Vorfahren des Ziels aufklappen, sonst führt ein
   Suchtreffer in einen unsichtbaren Ordner. */
function revealPath(target){
  let changed = false;
  for(let i = 1; i <= target.length; i += 1){
    const id = target.slice(0, i).join(".");
    if(folded.delete(id)) changed = true;
  }
  if(changed) saveFolds();
}

/* ==================== Mehrfachauswahl ====================
   Cmd- oder Ctrl-Klick markiert Ordner. Ein markierter Ordner lässt sich mit
   allen anderen zusammen in einem Zug verschieben. */

let picked = new Set();
const pickId = t => t.join(".");

/* Schiene und Ordnerinhalt sind zwei getrennte Dinge. Wer im Ordner
   auswählt, soll nicht versehentlich Ordner in der Schiene mitgreifen —
   deshalb merkt sich der Modus, wo er gilt. */
let selectScope = null;   /* "stage" | "rail" | null */

function clearPick(){
  const had = picked.size || selectScope;
  picked.clear();
  selectScope = null;
  if(had) render();
}
function togglePick(target){
  const id = pickId(target);
  if(picked.has(id)) picked.delete(id); else picked.add(id);
  render();
}

/* Ist ein Vorfahre ebenfalls markiert, wird der Ordner mitgenommen und darf
   nicht zusätzlich einzeln verschoben werden. */
function topPicks(){
  const all = [...picked].map(id => id.split(".").map(Number));
  return all.filter(t => !all.some(o =>
    o.length < t.length && o.every((v, i) => t[i] === v)));
}

/* Alle Dateien unterhalb eines Knotens einsammeln — beim Löschen eines
   Ordners müssen auch die Dateien darin aus dem Repository verschwinden. */
function filesUnder(node, out){
  out = out || [];
  if(!node) return out;
  if(node.file) out.push(node.file);
  (node.children || []).forEach(c => filesUnder(c, out));
  return out;
}

async function deleteMany(targets){
  const nodes = targets.map(t => nodeAt(t)).filter(Boolean);
  if(!nodes.length) return;

  const what = nodes.length === 1
    ? "«" + nodes[0].title + "»"
    : nodes.length + " Einträge";

  /* Erst entfernen, dann schauen, welche Dateien danach niemand mehr braucht.
     Zwei Einträge können auf dieselbe Datei zeigen — dann darf sie nur weg,
     wenn wirklich beide verschwinden. Und jeder Pfad höchstens einmal:
     derselbe Löschbefehl zweimal im selben Commit lässt GitHub mit
     BadObjectState abbrechen. */
  const before = usedFiles();
  const snapshot = JSON.parse(JSON.stringify(TREE));

  nodes.forEach(node => {
    const here = pathOf(node);
    if(!here) return;
    const list = listAt(parentOf(here));
    const i = list.indexOf(node);
    if(i !== -1) list.splice(i, 1);
  });

  const after = usedFiles();
  const orphans = [...before].filter(f => !after.has(f));

  const extra = orphans.length
    ? "\n\n" + orphans.length
      + (orphans.length === 1 ? " Datei wird" : " Dateien werden")
      + " ebenfalls aus dem Repository entfernt."
    : "";

  if(!confirm(what + " löschen?" + extra)){
    TREE.sections = snapshot.sections;   /* Abbruch: Baum zurücksetzen */
    render();
    return;
  }

  picked.clear();
  if(!nodeAt(path)) path = [];
  await run(what + " gelöscht",
            () => saveTree("Gelöscht: " + what,
                           orphans.map(f => ({ path: f, remove: true }))));
}

async function moveMany(targets, dest){
  const destNode = nodeAt(dest);
  const nodes = targets.map(t => ({ node: nodeAt(t), list: listAt(parentOf(t)) }));
  if(nodes.some(n => n.node === destNode)) return;
  nodes.forEach(({ node, list }) => {
    const i = list.indexOf(node);
    if(i !== -1) list.splice(i, 1);
  });
  const kids = destNode.children || (destNode.children = []);
  nodes.forEach(({ node }) => kids.push(node));
  picked.clear();
  path = pathOf(destNode) || [];
  revealPath(path);
  const what = nodes.length === 1 ? "«" + nodes[0].node.title + "»" : nodes.length + " Ordner";
  await run(what + " nach «" + destNode.title + "»",
            () => saveTree("Verschoben: " + what));
}

function renderRail(){
  const nav = $("#nav"); nav.textContent = "";
  if(!TREE) return;


  const add = (label, target, depth, count, isSection, hasKids) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = (isSection ? "sect" : "") + (picked.has(pickId(target)) ? " picked" : "");
    b.setAttribute("aria-selected", String(JSON.stringify(target) === JSON.stringify(path)));

    if(depth){
      const pad = document.createElement("span");
      pad.className = "pad";
      pad.style.width = (depth * 16) + "px";
      pad.setAttribute("aria-hidden", "true");
      b.appendChild(pad);
    }

    const tw = document.createElement("span");
    const closed = treeMode === "focus"
      ? !(onPath(target, path) || opened.has(foldId(target)))
      : folded.has(foldId(target));
    tw.className = "tw" + (hasKids ? (closed ? " closed" : "") : " leaf");
    tw.textContent = "›";
    tw.setAttribute("aria-hidden", "true");
    if(hasKids){
      b.setAttribute("aria-expanded", String(!closed));
      tw.addEventListener("click", ev => { ev.stopPropagation(); toggleFold(target); });
    }
    b.appendChild(tw);

    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = label;
    const cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = count || "";
    b.append(nm, cnt);
    if(admin && target.length){
      const k = document.createElement("span");
      k.className = "kebab"; k.textContent = "•••";
      k.addEventListener("click", ev => { ev.stopPropagation(); nodeMenu(target); });
      b.appendChild(k);
    }
    b.addEventListener("click", ev => {
      /* Cmd oder Ctrl markiert, statt zu navigieren. Bereiche selbst lassen
         sich nicht verschieben und deshalb auch nicht markieren. */
      if((selectScope === "rail" || ev.metaKey || ev.ctrlKey) && target.length > 1){
        ev.preventDefault();
        togglePick(target);
        return;
      }
      clearPick();
      goTo(target);
    });
    if(admin && target.length){
      makeDropTarget(b, target);
      if(target.length > 1) makeDraggable(b, target);
    }
    nav.appendChild(b);
  };

  const hasFolders = node => (node.children || []).some(c => c.type === "folder");

  TREE.sections.forEach((section, si) => {
    add(section.title, [si], 0, countQuiz(section), true, hasFolders(section));
    const walk = (node, base, depth) => {
      ordered(node.children).forEach(({ child, i }) => {
        if(child.type !== "folder") return;
        const here = base.concat(i);
        if(!hidden(here)) add(child.title, here, depth, countQuiz(child), false, hasFolders(child));
        if(depth < 6) walk(child, here, depth + 1);
      });
    };
    walk(section, [si], 1);
  });

  const quizzes = allQuizzes();
  const totals = quizzes.reduce((acc,q) => {
    const p = progressOf(q);
    acc.done += p.done; acc.total += p.total; return acc;
  }, { done:0, total:0 });
  const mini = $("#mini");
  mini.hidden = !totals.total || !showProgress;
  if(totals.total){
    $("#ratio").textContent = totals.done + " / " + totals.total;
    const pct = Math.round(totals.done/totals.total*100);
    requestAnimationFrame(() => { $("#pfill").style.width = pct + "%"; });
  }
  $("#lamp").className = "lamp" + (Sync.configured() && Sync.meta().lastSync ? " ok" : "");
}

/* Eine Eintragskarte — auch von der Trefferliste benutzt. */
function entryCard(child, target, showPath){
  if(child.type === "pdf"){
    const a = document.createElement("a");
    a.className = "card"; a.dataset.kind = "pdf";
    /* Leerzeichen und Umlaute im Dateinamen müssen in der Adresse kodiert
       werden, sonst bricht der Link. */
    a.href = encodeURI(child.file); a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = '<span class="ico" aria-hidden="true">▤</span>'
      + '<span class="body"><h3></h3><span class="meta"></span></span>'
      + '<span class="chev" aria-hidden="true">↗</span>';
    a.querySelector("h3").textContent = child.title;
    a.querySelector(".meta").textContent = showPath || child.meta || "PDF";
    return a;
  }

  const p = progressOf(child);
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  const done = p.total && p.done >= p.total;
  const a = document.createElement("a");
  a.className = "card"; a.dataset.kind = "quiz";
  a.href = "quiz.html?file=" + encodeURIComponent(child.file);
  a.innerHTML = '<span class="ico" aria-hidden="true">◉</span>'
    + '<span class="body"><h3></h3><span class="meta"></span>'
    + '<span class="foot"><span class="progress"><span class="progress-fill"></span></span>'
    + '<span class="stat"></span></span></span>'
    + '<span class="chev" aria-hidden="true">›</span>';
  a.querySelector("h3").textContent = child.title;
  a.querySelector(".meta").textContent = showPath || child.meta || "Kprim-Übungsprüfung";
  const fill = a.querySelector(".progress-fill");
  fill.style.display = "block"; fill.style.height = "100%";
  if(done) fill.style.background = "var(--green)";
  requestAnimationFrame(() => { fill.style.width = pct + "%"; });
  const stat = a.querySelector(".stat");
  stat.textContent = done ? "vollständig" : p.done ? p.done + " / " + p.total : "nicht begonnen";
  if(done) stat.classList.add("done");
  if(!p.done || !showProgress) a.querySelector(".foot").style.display = "none";
  return a;
}

/* ====================================================================
   Fortsetzen

   Alle angefangenen Prüfungen als quadratische Kacheln, zuletzt bearbeitete
   zuerst. Der Ring ersetzt den Balken: in einem Quadrat liest er sich besser
   und zeigt den Anteil, ohne dass man die Zahl braucht.

   Ein- und ausblenden geht direkt hier über die Kopfzeile — und bleibt so,
   bis man es zurücknimmt.
   ==================================================================== */

const RESUME_MAX = 6;

function openQuizzes(){
  const stamps = Sync.meta().stamps || {};
  /* Zeigen zwei Einträge auf dieselbe Datei, ist es derselbe Fortschritt —
     eine Kachel genügt. */
  const seen = new Set();
  return allQuizzes()
    .filter(q => { if(seen.has(q.file)) return false; seen.add(q.file); return true; })
    .map(q => ({ q, p: progressOf(q) }))
    .filter(x => x.p.done > 0 && x.p.total && x.p.done < x.p.total)
    .sort((a, b) => ((stamps[idFor(b.q)] || {}).updated || 0)
                  - ((stamps[idFor(a.q)] || {}).updated || 0));
}

function ring(pct, done){
  const r = 20, c = 2 * Math.PI * r;
  const wrap = document.createElement("span");
  wrap.className = "ringwrap";
  wrap.innerHTML =
    '<svg class="ring" viewBox="0 0 46 46" aria-hidden="true">'
    + '<circle class="bg" cx="23" cy="23" r="' + r + '"></circle>'
    + '<circle class="fg" cx="23" cy="23" r="' + r + '" '
    + 'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) + '"></circle>'
    + '</svg><span>' + pct + '</span>';
  requestAnimationFrame(() => {
    const fg = wrap.querySelector(".fg");
    if(fg) fg.setAttribute("stroke-dashoffset", (c * (1 - pct / 100)).toFixed(1));
  });
  return wrap;
}

function resumeTile(entry){
  const { q, p } = entry;
  const pct = Math.round(p.done / p.total * 100);
  const a = document.createElement("a");
  a.className = "wtile";
  a.dataset.kind = "resume";
  a.href = "quiz.html?file=" + encodeURIComponent(q.file);

  const h = document.createElement("h3");
  h.textContent = q.title;

  const foot = document.createElement("div");
  foot.className = "foot";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = "<b></b>";
  meta.querySelector("b").textContent = p.done + " / " + p.total;
  meta.append(document.createTextNode("beantwortet"));
  foot.append(meta, ring(pct, false));

  a.append(h, foot);
  return a;
}

     sonst käme man ohne Umweg über die Einstellungen nicht zurück. */

/* ==================== Auswahlmenüs ====================
   Für Ordner, die als Menü markiert sind: statt sich durch Ordnerkarten zu
   klicken, wählt man oben in Aufklappmenüs — bei den Mock Exams also erst
   das Jahr, dann das Semester — und darunter erscheint der Inhalt.

   Die Wahl bleibt pro Ordner gespeichert, damit man beim Zurückkommen dort
   weitermacht, wo man war.
   ==================================================================== */

/* Wo der Inhalt gerade herkommt — bei Auswahlmenüs der gewählte Unterordner,
   sonst schlicht der aktuelle Ordner. Hochladen und neue Ordner landen dort. */
let activePath = [];

const PICK_KEY = "pruefung:picks";
function readPicks(){
  try { return JSON.parse(localStorage.getItem(PICK_KEY) || "{}"); } catch(_) { return {}; }
}
function savePick(key, value){
  const all = readPicks();
  if(value === null) delete all[key]; else all[key] = value;
  try { localStorage.setItem(PICK_KEY, JSON.stringify(all)); } catch(_) {}
}

const folderKids = node => (node.children || []).filter(c => c.type === "folder" || !c.type);

/* Liefert den Knoten, dessen Inhalt gezeigt werden soll, und die Menüs
   darüber. Zwei Ebenen, wie besprochen; hat die zweite keine Unterordner,
   bleibt es bei einer. */
function pickerFor(node, base){
  const picks = readPicks();
  const fields = [];
  let current = node;
  let currentPath = base.slice();

  for(let level = 0; level < 2; level += 1){
    const kids = current.children || [];
    const options = kids.filter(c => c.type === "folder" || !c.type);
    if(!options.length) break;

    const key = currentPath.join(".");
    let index = options.findIndex(o => o.title === picks[key]);
    if(index === -1) index = 0;

    fields.push({ key, options, index, label: level === 0 ? "Jahrgang" : "Semester" });
    const chosen = options[index];
    currentPath = currentPath.concat(kids.indexOf(chosen));
    current = chosen;
  }
  return { fields, node: current, path: currentPath };
}

function renderPicker(node, base, cards){
  const { fields, node: target, path: targetPath } = pickerFor(node, base);
  if(!fields.length) return null;

  const wrap = document.createElement("div");
  wrap.className = "picker";
  fields.forEach((field, level) => {
    const box = document.createElement("label");
    box.className = "pickfield";
    const cap = document.createElement("span");
    cap.textContent = field.label;
    const sel = document.createElement("select");
    field.options.forEach((option, i) => {
      const el = document.createElement("option");
      el.value = option.title;
      el.textContent = option.title;
      if(i === field.index) el.selected = true;
      sel.appendChild(el);
    });
    sel.addEventListener("change", () => {
      savePick(field.key, sel.value);
      /* Tiefere Wahl verwerfen, sie gehört zum alten Zweig. */
      fields.slice(level + 1).forEach(f => savePick(f.key, null));
      render();
    });
    box.append(cap, sel);
    wrap.appendChild(box);
  });
  cards.appendChild(wrap);
  return { node: target, path: targetPath };
}

function renderStage(){
  if(!TREE) return;
  const old = document.getElementById("lead");
  if(old) old.remove();
  if(page) return renderPage(page);

  const node = nodeAt(path);

  const list = $("#listTitle");

  /* Ist der Ordner als Auswahl markiert, treten Aufklappmenüs an die Stelle
     der Ordnerkarten, und gezeigt wird der Inhalt der getroffenen Wahl. */
  let source = node;
  let sourcePath = path;
  if(node.picker){
    const picked = renderPicker(node, path, cards);
    if(picked){ source = picked.node; sourcePath = picked.path; }
  }

  activePath = sourcePath;
  const kids = source.children || [];
  const shown = ordered(kids);
  const entries = shown.filter(p => p.child.type === "pdf" || p.child.type === "quiz");
  const folders = shown.filter(p => p.child.type === "folder" || !p.child.type);

  if(admin && (kids.length > 1)){

  }
  list.hidden = !(entries.length || folders.length);

  folders.forEach(({ child, i: idx }) => {

    card.querySelector("h3").textContent = child.title;
    const n = countQuiz(child);
    card.querySelector(".meta").textContent = child.blurb || (n ? n + (n===1?" Eintrag":" Einträge") : "leer");
    const here = sourcePath.concat(idx);
    card.addEventListener("click", ev => {
      if(admin && (selectScope === "stage" || ev.metaKey || ev.ctrlKey)){
        ev.preventDefault();
        togglePick(here);
        return;
      }
      goTo(here);
    });
    if(admin) markPickable(card, here);
    cards.appendChild(card);
    if(admin){ attachMenu(card, here); makeDraggable(card, here); makeDropTarget(card, here); }
  });

  entries.forEach(({ child, i: idx }) => {
    if(child.type === "pdf"){
      const a = document.createElement("a");
      a.className = "card";
      a.dataset.kind = "pdf";
      a.href = encodeURI(child.file);
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<span class="ico" aria-hidden="true">▤</span>'
        + '<span class="body"><h3></h3><span class="meta"></span></span>'
        + '<span class="chev" aria-hidden="true">↗</span>';
      a.querySelector("h3").textContent = child.title;
      a.querySelector(".meta").textContent = child.meta || "PDF";
      cards.appendChild(a);
      if(admin){
        const t = sourcePath.concat(idx);
        attachMenu(a, t); makeDraggable(a, t); markPickable(a, t);
      }
      return;
    }

    const p = progressOf(child);
    const pct = p.total ? Math.round(p.done/p.total*100) : 0;
    const done = p.total && p.done >= p.total;
    const a = document.createElement("a");
    a.className = "card";
    a.dataset.kind = "quiz";
    a.href = "quiz.html?file=" + encodeURIComponent(child.file);
    a.innerHTML = '<span class="ico" aria-hidden="true">◉</span>'
      + '<span class="body"><h3></h3><span class="meta"></span>'
      + '<span class="foot"><span class="progress"><span class="progress-fill"></span></span>'
      + '<span class="stat"></span></span></span>'
      + '<span class="chev" aria-hidden="true">›</span>';
    a.querySelector("h3").textContent = child.title;
    a.querySelector(".meta").textContent = child.meta || "Kprim-Übungsprüfung";
    const fill = a.querySelector(".progress-fill");
    fill.style.display = "block";
    fill.style.height = "100%";
    fill.style.width = pct + "%";
    if(done) fill.style.background = "var(--green)";
    const stat = a.querySelector(".stat");
    stat.textContent = done ? "vollständig" : p.done ? p.done + " / " + p.total : "nicht begonnen";
    if(done) stat.classList.add("done");
    if(!p.done || !showProgress) a.querySelector(".foot").style.display = "none";
    cards.appendChild(a);
    if(admin){
      const t = sourcePath.concat(idx);
      attachMenu(a, t); makeDraggable(a, t); markPickable(a, t);
    }
  });

  if(!entries.length && !folders.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = "<b>Noch nichts hier</b><p>Dieser Bereich ist leer.</p>";
    cards.appendChild(e);
  }
}

/* Der Einzug soll nur bei einem echten Ortswechsel laufen. Ein Abgleich im
   Hintergrund zeichnet dieselbe Ansicht neu — würde die dann jedes Mal
   einfliegen, wäre das nach zehn Minuten unerträglich. */
let lastView = null;

function viewKey(){
  return page ? "p:" + page
       : query.trim().length >= 2 ? "q:" + query.trim().toLowerCase()
       : "f:" + path.join(".");
}

function markEntrance(){
  const key = viewKey();
  const changed = key !== lastView;
  lastView = key;
  const cards = $("#cards");
  const head = document.querySelector(".head") || document.querySelector("article");

  cards.classList.remove("enter");
  if(head) head.classList.remove("enter-head");
  if(!changed) return;

  /* Neustart der Animation erzwingen, sonst greift sie beim zweiten Mal nicht. */
  void cards.offsetWidth;
  cards.classList.add("enter");
  [...cards.children].forEach((el, i) => el.style.setProperty("--i", Math.min(i, 12)));
  const tiles = cards.querySelector(".tiles");
  if(tiles) [...tiles.children].forEach((el, i) => el.style.setProperty("--i", i));
  if(head){ void head.offsetWidth; head.classList.add("enter-head"); }
}

function render(){
  renderRail();
  renderStage();
  renderPickbar();
  updateTitle();
  markEntrance();
  /* Der Hochlade-Knopf hängt am Ort, nicht nur an der Anmeldung — also bei
     jedem Zeichnen nachziehen und nicht bloss einmal beim Start. */
  if(window.Admin) refreshAdmin();
}

      : query.trim().length >= 2 ? "Suche"

  } else {

  }
}

function deviceSheet(){

  body.innerHTML = '<p class="hint">Dein Fortschritt gehört zu diesem Code. '

    + '<code class="code" id="mycode"></code>'

    + '<p class="hint">Du hast schon einen Code von einem anderen Gerät? Hier eintragen — '
    + 'der Fortschritt beider Geräte wird zusammengeführt, es geht nichts verloren.</p>'
    + '<input type="text" id="incode" placeholder="Code eingeben" spellcheck="false" autocapitalize="off" autocorrect="off">'
