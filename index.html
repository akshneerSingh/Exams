  });

  body.querySelector("#use").addEventListener("click", async () => {
    const btn = body.querySelector("#use");
    btn.disabled = true; btn.textContent = "Übernehme …";
    try{
      const result = await Sync.useKey(body.querySelector("#incode").value);
      if(!result || !result.ok) throw new Error((result && result.reason) || "Abgleich fehlgeschlagen.");
      render();
      body.querySelector("#mycode").textContent = Sync.meta().key;
      note(body, "Übernommen. Dein Fortschritt ist jetzt auf beiden Geräten gleich.", true);
    }catch(e){ note(body, e.message, false); }
    finally{ btn.disabled = false; btn.textContent = "Übernehmen"; }
  });

  sheet.showModal();
}


/* ====================================================================
   Verwaltung

   Sichtbar nur, wenn auf diesem Gerät ein GitHub-Token hinterlegt ist.
   Jede Änderung schreibt content/index.json neu und committet sie zusammen
   mit den neuen Dateien in einem Zug.
   ==================================================================== */

let admin = false;

/* Ein Blatt mit Auswahlknöpfen. Die öffentliche Fassung hat sonst nur das
   Gerätewechsel-Blatt, das seinen Inhalt selbst schreibt. */
function menuSheet(title, items){
  $("#sheetHead").textContent = title;
  const body = $("#sheetBody"); body.textContent = "";
  items.forEach(item => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pick" + (item.danger ? " danger" : "");
    if(item.depth) b.style.paddingLeft = (14 + item.depth*16) + "px";
    b.textContent = item.label;
    b.addEventListener("click", () => { sheet.close(); item.run(); });
    body.appendChild(b);
  });
  sheet.showModal();
}

function refreshAdmin(){
  admin = !!(window.Admin && Admin.enabled());
  /* Beide Knöpfe stehen überall zur Verfügung. Fehlt für Dateien ein Ordner,
     fragt der Knopf danach — das ist besser, als ihn verschwinden zu lassen
     und den Benutzer suchen zu lassen, wo er hin ist. */
  ["#folderPlus", "#addFolderHere", "#uploadPlus", "#addFilesHere",
   "#selectBtn", "#editHere"]
    .forEach(sel => { const el = $(sel); if(el) el.hidden = !admin; });
  const railSel = $("#selectBtn");
  if(railSel) railSel.classList.toggle("on", selectScope === "rail");
  const edit = $("#editHere");
  if(edit) edit.classList.toggle("on", selectScope === "stage");
}

/* Der Baum wird lokal geändert und danach als ganze Datei committet. */
function treeJSON(){ return JSON.stringify(TREE, null, 2) + "\n"; }

async function saveTree(message, extra){
  const changes = (extra || []).concat([
    { path: (CFG.contentIndex || "content/index.json"), content: treeJSON() }
  ]);
  await Admin.commit(changes, message);
}

function parentOf(p){ return p.slice(0, -1); }
function listAt(p){
  return p.length ? (nodeAt(p).children || (nodeAt(p).children = [])) : TREE.sections;
}

/* Alle Ordner als flache Liste, für die Verschieben-Auswahl. */
function folderList(){
  const out = [];
  const walk = (node, base, depth) => {
    (node.children || []).forEach((child, i) => {
      if(child.type !== "folder") return;
      out.push({ label: child.title, target: base.concat(i), depth });
      walk(child, base.concat(i), depth + 1);
    });
  };
  TREE.sections.forEach((section, si) => {
    out.push({ label: section.title, target: [si], depth: 0 });
    walk(section, [si], 1);
  });
  return out;
}

/* ====================================================================
   Ziehen und Ablegen

   Nur im Verwaltungsmodus. Gezogen werden Ordner und Einträge, abgelegt
   wird auf Ordnern und Bereichen — in der Schiene wie in der Liste.

   Verschoben wird über Objektverweise, nicht über Indizes: sobald der
   Eintrag aus seiner alten Liste entfernt ist, verschieben sich die Indizes
   dahinter, und ein vorher gemerkter Zielindex zeigte ins Leere.
   ==================================================================== */

let dragSource = null;

function isInside(inner, outer){
  return outer.length <= inner.length
    && outer.every((v, i) => inner[i] === v);
}

function makeDraggable(el, target){
  el.draggable = true;
  el.addEventListener("dragstart", ev => {
    dragSource = target;
    el.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    /* Ohne Nutzlast verweigern manche Browser den Zug. */
    ev.dataTransfer.setData("text/plain", JSON.stringify(target));
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    dragSource = null;
    document.querySelectorAll(".into").forEach(n => n.classList.remove("into"));
  });
}

function makeDropTarget(el, target){
  const ok = () => dragSource
    && JSON.stringify(dragSource) !== JSON.stringify(target)
    && !isInside(target, dragSource);          /* nicht in sich selbst */

  el.addEventListener("dragover", ev => {
    if(!ok()) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    el.classList.add("into");
  });
  let hover = null;
  el.addEventListener("dragenter", () => {
    if(!ok()) return;
    clearTimeout(hover);
    hover = setTimeout(() => { revealPath(target); renderRail(); }, 700);
  });
  el.addEventListener("dragleave", () => {
    clearTimeout(hover);
    el.classList.remove("into");
  });
  el.addEventListener("drop", async ev => {
    ev.preventDefault();
    clearTimeout(hover);
    el.classList.remove("into");
    if(!ok()) return;
    const src = dragSource;
    dragSource = null;
    /* Wurde eine markierte Zeile gezogen, wandert die ganze Auswahl mit. */
    if(picked.has(pickId(src)) && picked.size > 1){
      await moveMany(topPicks(), target);
    } else {
      clearPick();
      await moveNode(src, target);
    }
  });
}

/* Den Indexpfad zu einem Knoten suchen. Nach dem Verschieben stimmen die
   alten Indizes nicht mehr, der Objektverweis dagegen schon. */
function pathOf(node){
  let found = null;
  const walk = (list, base) => {
    list.forEach((child, i) => {
      if(found) return;
      if(child === node){ found = base.concat(i); return; }
      if(child.children) walk(child.children, base.concat(i));
    });
  };
  walk(TREE.sections, []);
  return found;
}

async function moveNode(src, dest){
  const destNode = nodeAt(dest);
  const srcList = listAt(parentOf(src));
  const idx = src[src.length - 1];
  const moved = srcList[idx];
  if(!moved || moved === destNode) return;
  srcList.splice(idx, 1);
  (destNode.children || (destNode.children = [])).push(moved);
  /* Der Zielpfad kann sich durch das Entfernen verschoben haben. */
  path = pathOf(destNode) || [];
  revealPath(path);
  await run("«" + moved.title + "» nach «" + destNode.title + "»",
            () => saveTree("Verschoben: " + moved.title));
}

/* Im Auswahlmodus bekommt jede Karte ein Kästchen und fängt den Klick ab.
   Cmd-Klick funktioniert auch ohne Modus, wie in der Schiene. */
/* Die Leiste über den Karten. «Alle» bezieht sich auf das, was gerade zu
   sehen ist; Verschieben und Löschen auf alles Markierte, auch quer über
   Ordner hinweg. */
function moveSheet(targets){
  if(!targets.length) return;
  /* Ziele ausschliessen, die selbst markiert sind oder in einem markierten
     Ordner liegen — sonst zöge man einen Ast in sich selbst. */
  const blocked = new Set();
  targets.forEach(t => {
    blocked.add(JSON.stringify(t));
    folderList().forEach(f => {
      if(f.target.length > t.length && t.every((v, i) => f.target[i] === v)){
        blocked.add(JSON.stringify(f.target));
      }
    });
  });
  const choices = folderList()
    .filter(f => !blocked.has(JSON.stringify(f.target)))
    .map(f => ({ label: f.label, depth: f.depth,
                 run: () => moveMany(targets, f.target) }));
  menuSheet("Verschieben nach", choices);
}

/* Was in der Ablage liegt, muss sichtbar sein — sonst tippt man Cmd+V ins
   Leere oder vergisst, dass noch etwas wartet. */
function clipBar(){
  const bar = document.createElement("div");
  bar.className = "stagebar clipbar";

  const n = document.createElement("span");
  n.className = "n";
  const what = clip.labels.length === 1 ? "«" + clip.labels[0] + "»"
                                        : clip.labels.length + " Einträge";
  n.textContent = what + (clip.mode === "cut" ? " ausgeschnitten" : " kopiert");

  const paste = document.createElement("button");
  paste.type = "button";
  paste.textContent = path.length ? "Hier einfügen" : "Ordner wählen";
  paste.disabled = !path.length;
  paste.style.opacity = path.length ? "" : ".45";
  paste.addEventListener("click", clipPaste);

  const off = document.createElement("button");
  off.type = "button"; off.className = "plain"; off.textContent = "Verwerfen";
  off.addEventListener("click", () => { clip = null; render(); });

  bar.append(n, paste, off);
  return bar;
}

/* Eine Leiste für alles Markierte, unabhängig davon, wie es markiert wurde.
   Deshalb hängt sie an der Auswahl und nicht am Bearbeiten-Modus: mit Cmd
   greift man schnell etwas heraus, ohne den Modus einzuschalten, und hat
   trotzdem die Werkzeuge. */
function renderPickbar(){
  const old = document.getElementById("pickbar");
  if(old) old.remove();
  if(!admin || (!picked.size && !selectScope)) return;

  const bar = document.createElement("div");
  bar.className = "pickbar";
  bar.id = "pickbar";

  const n = document.createElement("span");
  n.className = "n";
  n.textContent = picked.size ? picked.size + " markiert"
    : (selectScope === "rail" ? "Ordner antippen" : "Einträge antippen");
  bar.appendChild(n);

  if(selectScope === "stage"){
    const kids = path.length ? (nodeAt(path).children || []) : [];
    const here = ordered(kids).map(({ i }) => (path.length ? path : []).concat(i));
    const allHere = here.length && here.every(t => picked.has(pickId(t)));
    if(here.length){
      const all = document.createElement("button");
      all.type = "button";
      all.textContent = allHere ? "Keine" : "Alle";
      all.addEventListener("click", () => {
        here.forEach(t => { if(allHere) picked.delete(pickId(t)); else picked.add(pickId(t)); });
        render();
      });
      bar.appendChild(all);
    }
  }

  const act = (label, cls, fn) => {
    const b = document.createElement("button");
    b.type = "button";
    if(cls) b.className = cls;
    b.textContent = label;
    b.disabled = !picked.size;
    b.addEventListener("click", fn);
    bar.appendChild(b);
    return b;
  };

  act("Verschieben", "", () => moveSheet(topPicks()));
  act("Kopieren", "", () => clipCopy("copy"));
  act("Löschen", "danger", () => deleteMany(topPicks()));

  const done = document.createElement("button");
  done.type = "button"; done.className = "done"; done.title = "Fertig";
  done.setAttribute("aria-label", "Auswahl beenden");
  done.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="1.9" stroke-linecap="round" aria-hidden="true">'
    + '<path d="M6 6l12 12M18 6 6 18"/></svg>';
  done.addEventListener("click", clearPick);
  bar.appendChild(done);

  document.body.appendChild(bar);
}


function markPickable(card, target){
  card.classList.add("pickable");
  if(picked.has(pickId(target))) card.classList.add("chosen");
  if(selectScope === "stage"){
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = "✓";
    tick.setAttribute("aria-hidden", "true");
    card.insertBefore(tick, card.firstChild);
  }
  if(card.tagName === "A"){
    card.addEventListener("click", ev => {
      if(selectScope === "stage" || ev.metaKey || ev.ctrlKey){
        ev.preventDefault(); ev.stopPropagation();
        togglePick(target);
      }
    });
  }
}

function attachMenu(card, target){
  const b = document.createElement("button");
  b.className = "rowbtn"; b.type = "button"; b.textContent = "•••";
  b.setAttribute("aria-label", "Verwalten");
  b.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); nodeMenu(target); });
  const chev = card.querySelector(".chev");
  if(chev) card.insertBefore(b, chev); else card.appendChild(b);
}

/* Startseite bearbeiten — Titel und Einleitungstext liegen im
   Inhaltsverzeichnis, also ist es dieselbe Schreibaktion wie sonst. */
function homeMenu(){
  menuSheet("Startseite", [
    { label: "Titel ändern", run: async () => {
        const t = prompt("Titel der Seite", TREE.title || "Übungsprüfungen");
        if(!t || !t.trim()) return;
        TREE.title = t.trim();
        await run("Titel geändert", () => saveTree("Titel geändert"));
      } },
    { label: "Einleitungstext ändern", run: async () => {
        const t = prompt("Text auf der Startseite (leer lassen zum Entfernen)", TREE.intro || "");
        if(t === null) return;
        if(t.trim()) TREE.intro = t; else delete TREE.intro;
        await run("Einleitung geändert", () => saveTree("Einleitung geändert"));
      } }
  ]);
}

function nodeMenu(target){
  const node = nodeAt(target);
  const isSection = target.length === 1;
  const items = [
    { label: "Umbenennen", run: async () => {
        const name = prompt("Neuer Titel", node.title);
        if(!name || !name.trim()) return;
        node.title = name.trim();
        await run("Umbenannt: " + node.title, () => saveTree("Umbenannt: " + node.title));
      } }
  ];

  if((node.children || []).some(c => c.type === "folder" || !c.type)){
    items.push({ label: node.picker ? "Auswahlmenüs ausschalten" : "Als Auswahlmenüs zeigen",
      run: async () => {
        if(node.picker) delete node.picker; else node.picker = true;
        await run(node.picker ? "Auswahlmenüs an" : "Auswahlmenüs aus",
                  () => saveTree("Ansicht geändert: " + node.title));
      } });
  }

  if(!isSection){
    items.push({ label: "Verschieben", run: () => {
      const choices = folderList()
        .filter(f => JSON.stringify(f.target) !== JSON.stringify(target)
                  && !JSON.stringify(f.target).startsWith(JSON.stringify(target).slice(0,-1)))
        .map(f => ({ label: f.label, depth: f.depth,
          run: () => moveNode(target, f.target) }));
      menuSheet("Verschieben nach", choices);
    }});

    items.push({ label: "Löschen", danger: true, run: async () => {
      const label = node.title;
      const isEntry = node.type === "pdf" || node.type === "quiz";
      if(!confirm("«" + label + "» löschen?" + (isEntry ? " Die Datei wird ebenfalls entfernt." : ""))) return;
      const file = node.file;
      listAt(parentOf(target)).splice(target[target.length-1], 1);
      path = parentOf(target);
      const extra = isEntry && file ? [{ path: file, remove: true }] : [];
      await run("Gelöscht: " + label, () => saveTree("Gelöscht: " + label, extra));
    }});
  }

  menuSheet(node.title, items);
}

/* Eine Schreibaktion mit Rückmeldung und Neuzeichnen. */
async function run(what, fn){
  const body = $("#sheetBody");
  try{
    document.body.classList.add("busy");
    await fn();
    render();
    flash(what + " · gespeichert");
  }catch(e){
    alert("Fehlgeschlagen: " + e.message + "\n\nDie Seite lädt neu, damit nichts durcheinander gerät.");
    location.reload();
  }finally{
    document.body.classList.remove("busy");
  }
}

/* Kurze Rückmeldung am unteren Rand. Wird auch ausserhalb der Verwaltung
   gebraucht, deshalb steht sie nicht dort drin. */
function flash(text){
  const el = document.createElement("div");
  el.className = "note ok";
  el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;box-shadow:0 20px 50px rgba(0,0,0,.6)";
  el.textContent = text + " — in etwa einer Minute live.";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* -------------------- Hochladen -------------------- */
/* Alle bereits vergebenen Dateipfade einsammeln. */
function usedFiles(){
  const out = new Set();
  const walk = list => (list || []).forEach(child => {
    if(child.file) out.add(child.file);
    if(child.children) walk(child.children);
  });
  walk(TREE.sections);
  return out;
}

/* Zwei Prüfungen mit demselben Titel ergaben denselben Dateinamen — die
   zweite überschrieb die erste, und beide Einträge zeigten danach auf
   dieselbe Datei. Deshalb wird durchgezählt, bis der Pfad frei ist. */
function freeFile(base, slug, ext, pending){
  const taken = usedFiles();
  (pending || []).forEach(c => taken.add(c.path));
  let name = base + slug + ext;
  let n = 2;
  while(taken.has(name)){ name = base + slug + "-" + n + ext; n += 1; }
  return name;
}

function uploadSheet(dropped){
  /* In der Übersicht selbst können keine Dateien liegen — also erst den
     Zielordner wählen und dann normal weiter. */
  if(!path.length){
    const choices = folderList().map(f => ({
      label: f.label, depth: f.depth,
      run: () => { goTo(f.target); uploadSheet(); }
    }));
    if(!choices.length){
      alert("Lege zuerst einen Ordner an — Dateien brauchen einen Platz.");
      return;
    }
    menuSheet("Wohin hochladen?", choices);
    return;
  }
  $("#sheetHead").textContent = "Hochladen nach «" + nodeAt(path).title + "»";
  const body = $("#sheetBody"); body.textContent = "";
  body.innerHTML = '<div class="drop" id="drop">PDF, HTML oder JSON hierher ziehen<br>oder klicken zum Auswählen'
    + '<input type="file" id="picker" multiple accept=".pdf,.html,.htm,.json" hidden></div>'
    + '<div class="queue" id="queue"></div>'
    + '<p class="hint">Alte HTML-Prüfungen werden beim Hochladen automatisch in JSON umgewandelt. '
    + 'Titel lassen sich vor dem Speichern noch ändern.</p>'
    + '<button class="btn" id="doUpload" type="button" hidden>Hochladen</button>';

  const drop = body.querySelector("#drop");
  const picker = body.querySelector("#picker");
  const queueEl = body.querySelector("#queue");
  const button = body.querySelector("#doUpload");
  const queue = [];

  drop.addEventListener("click", () => picker.click());
  ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => take([...(e.dataTransfer.files || [])]));
  picker.addEventListener("change", () => { take([...picker.files]); picker.value = ""; });

  /* Titel und Dateiname kommen aus dem Namen der Datei, die du ablegst —
     nicht aus dem Titel im Inneren der Prüfung, den der Generator dort
     hineinschreibt. Das wird hier gesetzt und nicht in admin.js, damit es
     auch dann gilt, wenn dort noch eine ältere Fassung liegt. */
  function fromFilename(item, file){
    const base = String(file.name || "").replace(/\.[^.]+$/, "");
    if(!base) return item;
    item.basename = (Admin.safeName ? Admin.safeName(base) : base);
    item.ext = item.ext || (item.kind === "pdf" ? ".pdf" : ".json");
    item.title = base.replace(/_+/g, " ").replace(/\s+/g, " ").trim() || base;
    return item;
  }

  async function take(files){
    for(const file of files){
      try{ queue.push(fromFilename(await Admin.prepare(file), file)); }
      catch(err){ queue.push({ error: err.message, title: file.name }); }
    }
    draw();
  }

  function draw(){
    queueEl.textContent = "";
    queue.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "qrow" + (item.error ? " bad" : "");
      const ico = document.createElement("span");
      ico.className = "qi"; ico.textContent = item.error ? "✕" : (item.kind === "pdf" ? "▤" : "◉");
      const name = document.createElement(item.error ? "span" : "input");
      if(item.error){ name.textContent = item.title; name.style.flex = "1"; }
      else { name.value = item.title; name.addEventListener("input", () => { item.title = name.value; }); }
      const meta = document.createElement("span");
      meta.className = "qm";
      meta.textContent = item.error ? item.error : (item.meta + (item.converted ? " · umgewandelt" : ""));

      /* Damit sichtbar ist, wie die Datei am Ende heisst — das Feld darüber
         ist der Titel und wurde regelmässig damit verwechselt. */
      const fname = document.createElement("span");
      fname.className = "qf";
      if(!item.error) fname.textContent = (item.basename || "") + (item.ext || "");
      const x = document.createElement("button");
      x.className = "qx"; x.type = "button"; x.textContent = "✕";
      x.addEventListener("click", () => { queue.splice(i,1); draw(); });
      const col = document.createElement("span");
      col.className = "qcol";
      col.append(name, fname);
      row.append(ico, col, meta, x);
      queueEl.appendChild(row);
    });
    button.hidden = !queue.some(q => !q.error);
  }

  button.addEventListener("click", async () => {
    const good = queue.filter(q => !q.error);
    if(!good.length) return;
    button.disabled = true; button.textContent = "Lade hoch …";
    const folder = path.map(i => "x").length;   /* nur zur Lesbarkeit */
    const base = "content/" + (nodeAt([path[0]]).id === "quizzes" ? "quizzes" : "unterlagen") + "/";
    const extra = [];
    good.forEach(item => {
      const file = freeFile(base, item.basename || Admin.safeName(item.title),
                            item.ext || (item.kind === "pdf" ? ".pdf" : ".json"), extra);
      extra.push({ path: file, content: item.content });
      listAt(activePath.length ? activePath : path).push({
        type: item.kind, title: item.title, file,
        meta: item.meta
      });
    });
    try{
      document.body.classList.add("busy");
      await saveTree("Hochgeladen: " + good.map(g => g.title).join(", "), extra);
      sheet.close(); render();
      flash(good.length + (good.length === 1 ? " Datei" : " Dateien") + " hochgeladen");
    }catch(e){
      alert("Fehlgeschlagen: " + e.message);
      location.reload();
    }finally{
      document.body.classList.remove("busy");
      button.disabled = false; button.textContent = "Hochladen";
    }
  });

  sheet.showModal();
  /* Vom Schreibtisch gezogene Dateien landen direkt in der Liste. */
  if(dropped && dropped.length) take(dropped);
}

/* ==================== Darstellung ====================
   Derselbe Speicherschlüssel wie in quiz.html, damit beide Seiten dieselbe
   Einstellung benutzen und nicht auseinanderlaufen. */

const THEME_KEY = "kprim-ui-theme";
const media = window.matchMedia("(prefers-color-scheme: dark)");
let themeMode = "auto";
try { themeMode = localStorage.getItem(THEME_KEY) || "auto"; } catch(_) {}

function applyTheme(){
  const dark = themeMode === "dark" || (themeMode === "auto" && media.matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function setTheme(mode){
  themeMode = mode;
  try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
  applyTheme();
}
media.addEventListener("change", () => { if(themeMode === "auto") applyTheme(); });
applyTheme();

function settingsSheet(){
  const label = { light: "Hell", dark: "Dunkel", auto: "Automatisch" };
  menuSheet("Darstellung", ["light", "dark", "auto"].map(mode => ({
    label: label[mode] + (mode === "auto" ? " · folgt dem System" : "")
           + (themeMode === mode ? "   ✓" : ""),
    run: () => { setTheme(mode); }
  })));
}
/* Ein Menü für alles, was Einstellung ist. Der Zustand steht als Beiwert in
   der Zeile, damit man ihn sieht, ohne hineinzugehen. */
function gearSheet(){
  const items = [
    { label: "Darstellung · " + { light:"Hell", dark:"Dunkel", auto:"Automatisch" }[themeMode],
      run: settingsSheet },
    { label: "Sortierung · " + SORTS[sortMode].label, run: sortSheet },
    { label: "Ordnerbaum · " + (treeMode === "focus" ? "Schrittweise" : "Ganzer Baum"),
      run: () => menuSheet("Ordnerbaum", [
        { label: "Schrittweise" + (treeMode === "focus" ? "   ✓" : ""),
          run: () => setTreeMode("focus") },
        { label: "Ganzer Baum" + (treeMode === "full" ? "   ✓" : ""),
          run: () => setTreeMode("full") }
      ]) },
    { label: "Fortschritt · " + (showProgress ? (showResume ? "sichtbar" : "ohne Kacheln") : "ausgeblendet"),
      run: progressSheet },
    { label: "Auf anderem Gerät fortsetzen"
             + (Sync.configured() && Sync.meta().lastSync ? " · aktiv" : ""),
      run: deviceSheet }
  ];
  if(admin || new URLSearchParams(location.search).has("admin")){
    items.push({ label: admin ? "Verwaltung · angemeldet" : "Verwaltung", run: adminSheet });
  }
  items.push({ label: "Fassung " + APP_VERSION + " · Stand prüfen", run: async () => {
    try{
      const res = await fetch("index.html?v=" + Date.now(), { cache: "no-store" });
      const text = await res.text();
      const m = text.match(/APP_VERSION = "(\d+)"/);
      const live = m ? m[1] : "?";
      if(live === APP_VERSION) flash("Fassung " + APP_VERSION + " — aktuell");
      else {
        if(confirm("Im Repository liegt Fassung " + live + ", hier läuft "
                   + APP_VERSION + ".\n\nJetzt neu laden?")){
          if(navigator.serviceWorker){
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
          if(window.caches){
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          location.reload(true);
        }
      }
    }catch(e){ alert("Konnte nicht prüfen: " + e.message); }
  }});

  menuSheet("Einstellungen", items);
}
$("#gearBtn").addEventListener("click", gearSheet);

$("#mbSettings").addEventListener("click", gearSheet);

/* ==================== Schublade auf dem Telefon ====================
   Auf schmalen Geräten liegt die Schiene neben dem Bild und fährt herein.

   Der Zustand bleibt pro Gerät erhalten. Auf schmalen Geräten ist die

const RAIL_KEY = "pruefung:rail";
function applyRail(){

  try { off = localStorage.getItem(RAIL_KEY) === "off"; } catch(_) {}
  document.body.classList.toggle("rail-off", off);
}

  try { localStorage.setItem(RAIL_KEY, off ? "off" : "on"); } catch(_) {}
  document.body.classList.toggle("rail-off", off);
}
$("#railToggle").addEventListener("click", toggleRail);
$("#railShow").addEventListener("click", toggleRail);
document.addEventListener("keydown", e => {

    e.preventDefault(); toggleRail();

/* ==================== Ablage: kopieren, ausschneiden, einfügen ==========
   Cmd/Ctrl + C, X und V wie im Finder. Ausschneiden verschiebt, Kopieren
   dupliziert — beim Duplizieren werden auch die Dateien im Repository
   vervielfältigt, sonst zeigten zwei Einträge auf dieselbe Datei und der
   Fortschritt liefe zusammen.
   ==================================================================== */

let clip = null;   /* { mode: "copy" | "cut", nodes: [...], labels: [...] } */

function clipCopy(mode){
  const targets = topPicks();
  if(!targets.length) return;
  clip = {
    mode,
    nodes: targets.map(t => nodeAt(t)).filter(Boolean),
    labels: targets.map(t => (nodeAt(t) || {}).title).filter(Boolean)
  };
  picked.clear();
  render();
  flash(clip.labels.length + (clip.labels.length === 1 ? " Eintrag" : " Einträge")
        + (mode === "cut" ? " ausgeschnitten" : " kopiert"));
}

/* Zielordner für neue Dateien: derselbe Zweig wie beim Hochladen. */
function baseFor(target){
  const section = nodeAt([target[0]]);
  return "content/" + (section && section.id === "quizzes" ? "quizzes" : "unterlagen") + "/";
}

/* Einen Knoten samt Inhalt vervielfältigen. Dateien werden aus dem
   Repository geholt und unter einem freien Namen neu abgelegt. */
async function cloneNode(node, base, pending){
  const copy = { ...node };
  delete copy.children;
  if(node.file){
    const response = await fetch(encodeURI(node.file), { cache: "no-store" });
    if(!response.ok) throw new Error("«" + node.title + "» ist noch nicht abrufbar.");
    const bytes = new Uint8Array(await response.arrayBuffer());
    const dot = node.file.lastIndexOf(".");
    const ext = dot === -1 ? "" : node.file.slice(dot);
    const stem = node.file.slice(node.file.lastIndexOf("/") + 1, dot === -1 ? undefined : dot);
    const file = freeFile(base, stem, ext, pending);
    pending.push({ path: file, content: bytes });
    copy.file = file;
  }
  if(node.children){
    copy.children = [];
    for(const child of node.children){
      copy.children.push(await cloneNode(child, base, pending));
    }
  }
  return copy;
}

async function clipPaste(){
  if(!clip || !clip.nodes.length) return;
  if(!path.length){
    alert("Öffne zuerst einen Ordner.");
    return;
  }
  const dest = nodeAt(path);
  if(clip.mode === "cut"){
    const targets = clip.nodes.map(n => pathOf(n)).filter(Boolean);
    clip = null;
    await moveMany(targets, path);
    return;
  }

  const pending = [];
  const base = baseFor(path);
  const kids = dest.children || (dest.children = []);
  try{
    document.body.classList.add("busy");
    for(const node of clip.nodes) kids.push(await cloneNode(node, base, pending));
  }catch(error){
    document.body.classList.remove("busy");
    alert("Kopieren fehlgeschlagen: " + error.message
          + "\n\nFrisch hochgeladene Dateien sind erst nach etwa einer Minute abrufbar.");
    location.reload();
    return;
  }finally{
    document.body.classList.remove("busy");
  }
  const what = clip.labels.length === 1 ? "«" + clip.labels[0] + "»"
                                        : clip.labels.length + " Einträge";
  clip = null;
  await run(what + " kopiert nach «" + dest.title + "»",
            () => saveTree("Kopiert: " + what, pending));
}

document.addEventListener("keydown", ev => {
  if(!admin || !(ev.metaKey || ev.ctrlKey)) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const key = ev.key.toLowerCase();
  if(key === "c" && picked.size){ ev.preventDefault(); clipCopy("copy"); }
  else if(key === "x" && picked.size){ ev.preventDefault(); clipCopy("cut"); }
  else if(key === "v" && clip){ ev.preventDefault(); clipPaste(); }
});

/* ==================== Ablegen vom Schreibtisch ====================
   Dateien direkt ins Fenster ziehen. Der Zähler auf dem Fenster ist nötig,
   weil dragleave auch beim Überfahren von Kindelementen feuert — ohne ihn
   flackerte die Fläche bei jeder Bewegung.
   ==================================================================== */

let dragDepth = 0;

function carriesFiles(ev){
  const t = ev.dataTransfer && ev.dataTransfer.types;
  return t && [...t].includes("Files");
}

function dropHint(){
  const inner = $("#dropinner");
  const where = path.length ? nodeAt(path).title : null;
  inner.firstChild.textContent = where ? "Ablegen in «" + where + "»" : "Ordner wählen";
  inner.querySelector("span").textContent = where
    ? "PDF, HTML oder JSON"
    : "Öffne zuerst einen Ordner, dann kannst du hier ablegen.";
}

window.addEventListener("dragenter", ev => {
  if(!admin || !carriesFiles(ev)) return;
  ev.preventDefault();
  dragDepth += 1;
  dropHint();
  document.body.classList.add("dropping");
});
window.addEventListener("dragover", ev => {
  if(!admin || !carriesFiles(ev)) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = path.length ? "copy" : "none";
});
window.addEventListener("dragleave", ev => {
  if(!admin || !carriesFiles(ev)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if(!dragDepth) document.body.classList.remove("dropping");
});
window.addEventListener("drop", async ev => {
  if(!admin || !carriesFiles(ev)) return;
  ev.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dropping");
  const files = [...(ev.dataTransfer.files || [])];
  if(!files.length) return;
  if(!path.length){
    alert("Öffne zuerst einen Ordner — in der Übersicht können keine Dateien liegen.");
    return;
  }
  uploadSheet(files);
});

    refreshAdmin();
    render();
    if(Sync.configured() && Sync.meta().key) Sync.sync();
  })
  .catch(err => {
    $("#title").textContent = "Inhalt nicht erreichbar";
    $("#sub").textContent = "content/index.json liess sich nicht laden (" + err.message + ").";
    $("#brandSub").textContent = "Fehler";
  });

window.addEventListener("pageshow", () => { if(TREE) render(); });
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      /* Wartet eine neue Fassung, sofort durchlassen — sonst sähe man beim
         Neuladen weiterhin die alte. */
      if(reg.waiting) reg.waiting.postMessage("skip-waiting");
      reg.addEventListener("updatefound", () => {
        const fresh = reg.installing;
        if(!fresh) return;
        fresh.addEventListener("statechange", () => {
          if(fresh.state === "installed" && navigator.serviceWorker.controller){
            fresh.postMessage("skip-waiting");
          }
        });
      });
      reg.update();
    }).catch(() => {});
  });
}
})();
