<style>
/* ============================================================================
   Startseite.

   Links die Schiene mit den Abschnitten aus content/index.json, rechts der
   Inhalt des gewählten Ordners. Alles, was hier steht, liegt im Repository und
   ist für jeden sichtbar. Was nicht sichtbar ist: der gelöste Fortschritt —
   der bleibt im Browser des jeweiligen Besuchers.
   ========================================================================== */

:root{
  --bg:#000; --card:#141416; --card-2:#1d1d20; --raised:#2a2a2e;
  --hair:rgba(255,255,255,.08);
  --label:#f5f5f7; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.32);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,
         "Helvetica Neue",Helvetica,Arial,sans-serif;
  --rail-w:308px;
  --rail-gap:16px;              /* Abstand der Platte zum Fensterrand */

  /* Federkurven. Nichts läuft gleichförmig: alles schwingt leicht über und
     pendelt sich ein, damit Bewegungen Gewicht haben statt zu rutschen. */
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-soft:cubic-bezier(.34,1.4,.42,1);

  /* Durchscheinendes Material — der Inhalt schimmert verschwommen durch,
     statt hinter einer deckenden Fläche zu verschwinden. */
  --glass:rgba(22,22,24,.62);
  --glass-blur:saturate(180%) blur(28px);
  --lift:0 1px 2px rgba(0,0,0,.28),0 12px 32px rgba(0,0,0,.34);
  --lift-hi:0 2px 4px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.44);
}
/* Helle Fassung. Die Marken bleiben dieselben, nur ihre Werte drehen sich —
   deshalb steht das Aussehen der ganzen Seite in diesen zwölf Zeilen. */
html[data-theme="light"]{
  --glass:rgba(255,255,255,.7);
  --lift:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.08);
  --lift-hi:0 2px 6px rgba(0,0,0,.08),0 18px 42px rgba(0,0,0,.12);
  --bg:#f7f7f9; --card:#ffffff; --card-2:#f2f2f5; --raised:#e8e8ec;
  --hair:rgba(0,0,0,.08);
  --label:#0b0b0c; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.34);
  --blue:#007aff; --green:#28a745; --red:#d70015; --orange:#c76b00;
  color-scheme:light;
}
html[data-theme="light"] .rail{background:#fbfbfd}
html[data-theme="light"] .seg button:hover,
html[data-theme="light"] .chip:hover{background:rgba(0,0,0,.05)}
html[data-theme="light"] .search input{background:rgba(0,0,0,.05)}
html[data-theme="light"] .search input:hover{background:rgba(0,0,0,.075)}
html[data-theme="light"] .search input:focus{background:#fff;box-shadow:0 0 0 3.5px rgba(0,122,255,.22)}
html[data-theme="light"] .search .clr{background:rgba(0,0,0,.16)}
html[data-theme="light"] .progress{background:rgba(0,0,0,.09)}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
html[data-theme="light"] .tile{box-shadow:0 1px 2px rgba(0,0,0,.05)}
html[data-theme="light"] dialog{box-shadow:0 30px 80px rgba(0,0,0,.22)}
html[data-theme="light"] .railshow{background:rgba(0,0,0,.07)}
html[data-theme="light"] .btn.ghost{background:rgba(0,0,0,.07)}
html[data-theme="light"] .pick{background:var(--card-2)}
html[data-theme="light"] .qrow{background:var(--card-2)}
html[data-theme="light"] input,html[data-theme="light"] textarea{background:#fff}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--sans);
  font-size:16px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:rgba(10,132,255,.35)}
button,input{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ============ Schiene ============ */
.rail{
  position:fixed;z-index:45;
  top:calc(var(--rail-gap) + env(safe-area-inset-top));
  left:var(--rail-gap);
  bottom:var(--rail-gap);
  width:var(--rail-w);
  display:flex;flex-direction:column;
  padding:18px 12px 12px;
  border:.5px solid var(--hair);
  border-radius:14px;
  background:var(--glass);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  box-shadow:var(--lift);
}
html[data-theme="light"] .rail{background:var(--glass)}
.brand{padding:0 8px;margin-bottom:4px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.018em}
.brand span{display:block;font-size:12px;color:var(--label-3);font-weight:500;
  margin-top:2px;line-height:1.35}
.railtitle{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);padding:0 8px;margin:26px 0 8px}
.seg{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;
  padding-right:2px}
/* Zeile im Baum. Die Einrückung sitzt in einem eigenen Feld links, nicht im
   Innenabstand — dadurch bleibt die Trefferfläche über die volle Breite und
   die Namen stehen sauber untereinander. */
.seg button{
  position:relative;display:flex;align-items:center;gap:7px;width:100%;
  min-height:34px;padding:0 12px 0 6px;
  color:var(--label-2);font-size:14px;font-weight:450;letter-spacing:-.012em;
  border-radius:8px;text-align:left;
  transition:background .16s ease,color .16s ease}
.seg button:active{background:rgba(118,118,128,.26)}
.seg button:hover{background:rgba(118,118,128,.16);color:var(--label)}
.seg button[aria-selected="true"]{background:rgba(10,132,255,.16);color:var(--blue);font-weight:600}
.seg button.picked{background:rgba(10,132,255,.26);color:var(--blue)}
.seg button.picked .cnt{color:var(--blue);opacity:.8}

/* Leiste über der Auswahl. Erscheint nur, solange etwas markiert ist. */
.selbar{display:flex;align-items:center;gap:8px;margin:0 0 8px;
  padding:8px 10px;border-radius:10px;
  background:rgba(10,132,255,.14);border:.5px solid rgba(10,132,255,.3)}
.selbar .n{flex:1;font-size:12.5px;font-weight:600;color:var(--blue)}
.selbar button{font-size:12.5px;font-weight:600;color:var(--blue);
  padding:4px 8px;border-radius:7px;transition:background .15s}
.selbar button:hover{background:rgba(10,132,255,.2)}
.selbar button.plain{color:var(--label-3)}
.seg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Klapp-Pfeil links vom Namen. Wo es nichts zu klappen gibt, hält ein
   unsichtbarer Platzhalter die Namen trotzdem auf einer Fluchtlinie. */
/* Einrückungsfeld: pro Ebene ein fester Streifen mit einer feinen Führungslinie.
   Ohne sie verliert man bei drei Ebenen die Zuordnung. */
.seg .pad{flex:none;align-self:stretch;position:relative}
.seg .pad::before{content:"";position:absolute;top:3px;bottom:3px;right:9px;
  width:1px;background:var(--hair)}
.seg .pad.root::before{display:none}

/* Aufklapp-Zeiger: schlanker Winkel statt vollflächigem Dreieck. */
.seg .tw{flex:none;width:20px;height:20px;display:grid;place-items:center;
  color:var(--label-3);font-size:11px;border-radius:5px;
  transform:rotate(90deg);
  transition:transform .2s var(--spring),background .15s ease,color .15s ease}
.seg .tw:hover{background:rgba(118,118,128,.28);color:var(--label)}
.seg .tw.closed{transform:rotate(0deg)}
.seg .tw.leaf{visibility:hidden}
.seg .cnt{margin-left:auto;padding-left:10px;font-size:11.5px;font-weight:600;
  color:var(--label-3);font-variant-numeric:tabular-nums}
.seg button[aria-selected="true"] .cnt{color:var(--blue);opacity:.85}
.seg .sect{margin-top:18px;font-weight:600;font-size:14.5px;color:var(--label)}
.seg .sect:first-child{margin-top:0}
.seg .cnt{font-variant-numeric:tabular-nums}
.railfoot{margin-top:auto;padding-top:18px}
.mini{padding:0 8px 12px}
.mini .lab{font-size:11.5px;color:var(--label-3);font-weight:500;display:flex;
  justify-content:space-between;margin-bottom:7px;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .35s ease}
/* Nur noch eine Zeile: ein Zahnrad für alles, was Einstellung ist, und für
   Angemeldete ein Plus. Sechs gleich aussehende Zeilen für sechs sehr
   verschiedene Dinge waren der Grund, warum hier nichts hervorstach. */
.tools{display:flex;gap:6px;padding:0 4px}
.tool{position:relative;width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;color:var(--label-2);font-size:15px;
  transition:background .15s ease,color .15s ease}
.tool:hover{background:rgba(118,118,128,.2);color:var(--label)}
.tool .lamp{position:absolute;top:5px;right:5px;width:6px;height:6px;margin:0}
.chip{display:flex;align-items:center;gap:8px;width:100%;color:var(--label-2);
  font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:9px;
  text-align:left;transition:background .16s ease,color .16s ease,transform .18s var(--spring-soft)}
.chip:active{transform:scale(.975);transition-duration:.08s}
.chip:hover{background:rgba(118,118,128,.16);color:var(--label)}
.lamp{width:7px;height:7px;border-radius:50%;background:transparent;margin-left:auto;flex:none}
.lamp.ok{background:var(--green)}

/* ============ Bühne ============ */
main{margin-left:calc(var(--rail-w) + var(--rail-gap)*2);padding:46px 28px 80px}
main > article{max-width:760px;margin:0 auto;min-width:0}
.crumb{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:10px;
  display:inline-flex;align-items:center;gap:4px}
h1{font-size:32px;font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:0}
.titlerow{display:flex;align-items:center;gap:12px}
.addhere{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--blue);background:rgba(10,132,255,.14);font-size:19px;line-height:1;
  transition:background .15s ease,transform .18s var(--spring-soft)}
.addhere:hover{background:rgba(10,132,255,.24)}
.addhere:active{transform:scale(.92)}
.sub{font-size:14px;color:var(--label-3);margin-top:6px;max-width:56ch}
.sectitle{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin:34px 0 10px}

.resume{display:block;background:linear-gradient(180deg,rgba(10,132,255,.15),rgba(10,132,255,.06));
  border:.5px solid rgba(10,132,255,.28);border-radius:18px;padding:20px;margin-top:18px;
  transition:transform .26s var(--spring-soft),box-shadow .26s var(--spring),
             border-color .16s ease}
.resume:hover{border-color:rgba(10,132,255,.55);transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(10,132,255,.22)}
.resume:active{transform:translateY(-1px) scale(.996);transition-duration:.09s}
.resume .go{transition:transform .2s var(--spring-soft),opacity .15s}
.resume:hover .go{transform:scale(1.03)}
.resume .kick{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--blue);margin-bottom:9px}
.resume h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25}
.resume .where{font-size:14px;color:var(--label-2);margin-top:5px}
.resume .row{display:flex;align-items:center;gap:14px;margin-top:16px}
.resume .progress{flex:1}
.resume .pct{font-size:13px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;flex:none}
.resume .go{background:var(--blue);color:#fff;border-radius:100px;padding:9px 18px;
  font-size:14.5px;font-weight:600;letter-spacing:-.012em;flex:none}

.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.card{display:flex;align-items:center;gap:12px;background:var(--card);
  border:.5px solid transparent;border-radius:14px;padding:15px 16px;
  min-width:0;text-align:left;
  transform:translateZ(0);
  transition:transform .22s var(--spring-soft),box-shadow .22s var(--spring),
             background .16s ease,border-color .16s ease}
/* Zwei Pixel Hub und ein Schatten — der Unterschied zwischen Bild und
   Oberfläche liegt genau hier, nicht in grösseren Effekten. */
.card:hover{background:var(--card-2);transform:translateY(-2px);
  box-shadow:var(--lift);border-color:var(--hair)}
.card:active{transform:translateY(0) scale(.994);box-shadow:none;
  transition-duration:.09s}
.card .ico{flex:none;width:26px;text-align:center;color:var(--label-3);font-size:15px}
.card .body{flex:1 1 0;min-width:0;max-width:100%;text-align:left}
.card h3{font-size:16.5px;font-weight:600;letter-spacing:-.016em;margin:0;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3,.card .meta{display:block;max-width:100%}
.card .meta{font-size:13px;color:var(--label-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .body,.card .foot{display:block;max-width:100%}
.card .foot{display:flex}
.resume h2,.resume .where{overflow-wrap:break-word}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:11px;min-width:0}
.card .foot .progress{flex:1;max-width:200px}
.card .stat{font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums}
.card .stat.done{color:var(--green)}
.chev{flex:none;color:var(--label-3);font-size:17px}

.empty{background:var(--card);border-radius:14px;padding:26px 20px;text-align:center}
.empty b{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.empty p{margin:0;font-size:14px;color:var(--label-3);line-height:1.5}

/* ============ Suche ============ */
/* Runde Kapsel wie in den Systemprogrammen: gefüllte Fläche ohne Rahmen,
   beim Tippen leicht heller, im Fokus ein weicher Ring statt einer Kante. */
.search{position:relative;margin:0 8px 4px}
.search input{
  width:100%;height:32px;padding:0 30px 0 31px;
  border:0;border-radius:999px;
  background:rgba(118,118,128,.16);
  color:var(--label);font-size:13.5px;font-family:var(--sans);
  letter-spacing:-.011em;
  transition:background .18s ease,box-shadow .18s ease}
.search input::placeholder{color:var(--label-3)}
.search input::-webkit-search-decoration,
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:hover{background:rgba(118,118,128,.22)}
.search input:focus{
  outline:none;background:rgba(118,118,128,.26);
  box-shadow:0 0 0 3.5px rgba(10,132,255,.28)}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--label-3);font-size:13px;pointer-events:none;transition:color .18s}
.search input:focus ~ .mag{color:var(--label-2)}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%) scale(.7);
  width:22px;height:22px;border-radius:50%;color:var(--label-3);font-size:10px;
  opacity:0;pointer-events:none;display:grid;place-items:center;
  background:rgba(118,118,128,.35);
  transition:opacity .15s ease,transform .15s ease}
.search.has .clr{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.search .clr:hover{background:rgba(118,118,128,.55);color:var(--label)}

/* ============ Schiene ein- und ausklappen ============ */
.railtoggle{position:absolute;top:calc(18px + env(safe-area-inset-top));right:10px;
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--label-3);font-size:14px;transition:.15s}
.railtoggle:hover{background:rgba(118,118,128,.2);color:var(--label)}
.rail{transition:transform .42s var(--spring),opacity .28s ease}
main{transition:margin-left .42s var(--spring)}
body.rail-off .rail{transform:translateX(calc(-100% - var(--rail-gap)*2));opacity:0}
body.rail-off main{margin-left:0}
.railshow{position:fixed;top:calc(16px + env(safe-area-inset-top));left:14px;z-index:46;
  width:32px;height:32px;border-radius:9px;display:none;place-items:center;
  color:var(--label-2);background:rgba(118,118,128,.2);font-size:15px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.railshow:hover{color:var(--label);background:rgba(118,118,128,.32)}
body.rail-off .railshow{display:grid}

/* ============ Ziehen und Ablegen ============ */
.card[draggable="true"],.seg button[draggable="true"]{cursor:grab}
.dragging{opacity:.4}
.card.into{box-shadow:inset 0 0 0 2px var(--blue);background:rgba(10,132,255,.1)}
.seg button.into{box-shadow:inset 0 0 0 2px var(--blue)}
.hintline{font-size:12.5px;color:var(--label-3);margin:0 0 10px}
.grouphead{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label-3);margin:22px 0 8px}
.grouphead:first-child{margin-top:0}

/* ============ Startseite ============ */
.hero{margin-bottom:8px}
#lead{font-size:17px;line-height:1.55;color:var(--label-2);
  margin:14px 0 26px;max-width:62ch;white-space:pre-line}
.hero .lead:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tile{display:block;width:100%;background:var(--card);
  border:.5px solid transparent;border-radius:18px;padding:22px;
  min-width:0;text-align:left;color:inherit;
  transition:transform .26s var(--spring-soft),box-shadow .26s var(--spring),
             background .16s ease,border-color .16s ease}
.tile:hover{background:var(--card-2);transform:translateY(-3px);
  box-shadow:var(--lift-hi);border-color:var(--hair)}
.tile:active{transform:translateY(-1px) scale(.995);transition-duration:.09s}
.tile .ti{font-size:19px;color:var(--label-3);margin-bottom:12px}
.tile h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.tile p{margin:6px 0 0;font-size:13.5px;color:var(--label-3);line-height:1.5}
.tile .n{margin-top:14px;font-size:12.5px;color:var(--label-3);
  font-variant-numeric:tabular-nums}

/* ============ Fusszeile und Rechtliches ============ */
.railfoot .legal{display:flex;gap:12px;padding:14px 6px 2px;flex-wrap:wrap}
.railfoot .legal a{font-size:11.5px;color:var(--label-3);transition:color .15s}
.railfoot .legal a:hover{color:var(--label-2)}
.brandlink{display:block;width:100%;text-align:left;padding:0 8px;
  border-radius:8px;transition:background .15s}
.brandlink:hover{background:rgba(118,118,128,.14)}
.prose{max-width:62ch}
.prose h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:30px 0 8px}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 12px;font-size:15.5px;line-height:1.6;color:var(--label-2)}
.prose a{color:var(--blue)}
.prose ul{margin:0 0 12px;padding-left:20px;color:var(--label-2);
  font-size:15.5px;line-height:1.6}
.prose li{margin-bottom:5px}
.prose .small{font-size:13.5px;color:var(--label-3)}

/* ============ Verwaltung ============ */
.rowbtn{flex:none;width:34px;height:34px;border-radius:50%;color:var(--label-3);
  font-size:13px;letter-spacing:.04em;transition:.15s}
.rowbtn:hover{background:rgba(118,118,128,.2);color:var(--label)}
.seg .kebab{flex:none;width:20px;text-align:center;color:var(--label-3);font-size:11px;
  letter-spacing:.04em;opacity:0;transition:opacity .15s}
.seg button:hover .kebab,.seg button[aria-selected="true"] .kebab{opacity:1}
.drop{border:1.5px dashed var(--hair);border-radius:14px;padding:26px 18px;

/* ============ Bewegung ============
   Eine gemeinsame Kurve für alles: schnell los, weich aus. Das ist die
   Federung, die Fenster und Blätter in den Systemprogrammen benutzen.

   Die Einzugsbewegung läuft nur bei einem echten Ortswechsel — sonst würde
   jeder Abgleich im Hintergrund die halbe Seite neu einfliegen lassen.
   ================================================== */
:root{
  --spring:cubic-bezier(.32,.72,0,1);
  --quick:cubic-bezier(.25,.46,.45,.94);
}

@keyframes rise{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:none}
}
@keyframes settle{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
@keyframes sheetIn{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

/* Gestaffelter Einzug: jede Karte startet 34ms nach der vorigen. */
.enter > .card,
.enter > .tiles > .tile,
.enter > .resume,
.enter > .prose,
.enter > .grouphead{
  animation:rise .42s var(--spring) backwards;
  animation-delay:calc(var(--i,0) * 34ms);
}
.enter-head h1,.enter-head .sub,.enter-head #lead,.enter-head .crumb{
  animation:settle .38s var(--spring) backwards}
.enter-head .sub{animation-delay:40ms}
.enter-head #lead{animation-delay:60ms}

/* Karten heben sich beim Überfahren leicht an und geben beim Tippen nach. */
.card,.tile{
  transition:background .18s var(--quick),
             transform .22s var(--spring),
             box-shadow .22s var(--quick);
  will-change:transform}
@media (hover:hover){
  .card:hover,.tile:hover{transform:translateY(-2px)}
  .card:hover{box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .tile:hover{box-shadow:0 14px 34px rgba(0,0,0,.32)}
  html[data-theme="light"] .card:hover{box-shadow:0 8px 22px rgba(0,0,0,.09)}
  html[data-theme="light"] .tile:hover{box-shadow:0 12px 30px rgba(0,0,0,.1)}
  .resume:hover{transform:translateY(-2px)}
}
.card:active,.tile:active{transform:scale(.988);transition-duration:.09s}
.resume{transition:transform .22s var(--spring),border-color .18s var(--quick)}
.resume:active{transform:scale(.992)}

/* Der Balken wächst in seine Länge, statt fertig dazustehen. */
.progress-fill{transition:width .6s var(--spring)}

/* Blatt und Verdunklung */
dialog{animation:sheetIn .34s var(--spring)}
dialog::backdrop{animation:fadeIn .24s var(--quick)}
.pick,.btn,.chip,.seg button,.linkbtn,.mb-btn{transition:background .16s var(--quick),
  color .16s var(--quick),transform .16s var(--spring)}
.pick:active,.btn:active{transform:scale(.985)}

/* Klapp-Pfeil und Suchfeld schwingen mit derselben Kurve. */
.seg .tw{transition:transform .24s var(--spring),background .15s,color .15s}
.search input{transition:background .18s var(--quick),box-shadow .22s var(--spring)}

@media (prefers-reduced-motion:reduce){
  .enter > *,.enter-head *{animation:none!important}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ Handy-Leiste ============ */

             -webkit-backdrop-filter .22s ease,backdrop-filter .22s ease}
/* Erst wenn Inhalt darunter durchläuft, bekommt die Leiste Material und
   Trennlinie. Oben steht sie unsichtbar über der Seite. */

  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);

/* ============ schmal ============ */
@media (max-width:860px){
  /* Die Schiene bleibt aufgebaut wie am Schreibtisch, liegt aber neben dem

    top:var(--rail-gap);left:var(--rail-gap);bottom:var(--rail-gap);

    box-shadow:var(--lift-hi)}
  body.drawer .rail{transform:none;opacity:1}
  body.drawer .scrim{opacity:1;pointer-events:auto}

  main{margin-left:0;padding:20px 16px 60px;width:100%;min-width:0}

  .card{padding:14px}
  .card .chev{display:none}

  .resume .row{flex-wrap:wrap}
  .resume .go{width:100%;text-align:center}
  .tiles{grid-template-columns:minmax(0,1fr)}
  dialog{width:min(460px,calc(100vw - 24px))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .card:hover,.tile:hover,.resume:hover{transform:none}
}

<script>
(() => {
"use strict";

const CFG = window.APP_CONFIG || {};
const PROG = "pruefung:progress:";
const $ = s => document.querySelector(s);

let TREE = null;      /* Abschnitte aus content/index.json */
let path = [];        /* Indexpfad in den Baum, z.B. [0,1,0] */

/* ==================== Baum ==================== */
function nodeAt(p){
  let node = { children: TREE ? TREE.sections : [] };
  p.forEach(i => { node = (node.children || [])[i]; });
  return node;
}
function isFolder(n){ return n && (n.type === "folder" || Array.isArray(n.sections) || (!n.type && n.children)); }
function countQuiz(n){
  if(!n) return 0;
  if(n.type === "quiz" || n.type === "pdf") return 1;
  return (n.children || []).reduce((s,c) => s + countQuiz(c), 0);
}
function quizzesIn(n, out){
  out = out || [];
  if(!n) return out;
  if(n.type === "quiz") out.push(n);
  (n.children || []).forEach(c => quizzesIn(c, out));
  return out;
}
function allQuizzes(){
  return (TREE ? TREE.sections : []).reduce((a,s) => a.concat(quizzesIn(s)), []);
}

/* ==================== Fortschritt ==================== */
const rd = (k,f) => { try{ const v = localStorage.getItem(k); return v===null?f:JSON.parse(v); }catch(_){ return f; } };
const idFor = q => "file:" + q.file;
function progressOf(q){
  const s = rd(PROG + idFor(q), null);
  if(!s || !Array.isArray(s.rounds) || !s.rounds[0]) return { done:0, total:0, last:null };
  const r0 = s.rounds[0];
  const r = s.rounds[s.round || 0] || r0;
  return {
    done: Object.keys(r0.answers || {}).length,
    total: s.questionCount || 0,
    last: r && Number.isInteger(r.lastQ) ? r.lastQ : null
  };
}

/* ====================================================================
   Suche

   Bei ein paar hundert Einträgen ist der einfache Durchlauf durch alle das
   schnellste Verfahren — unter einer Millisekunde. Sortiert wird nicht die
   Datenbasis, sondern die Trefferliste: Titelanfang schlägt Titelmitte,
   Titel schlägt Ordnername.

   Umlaute werden vorher aufgelöst, damit «prufung» auch «Prüfung» findet.
   ==================================================================== */

let query = "";

function fold(text){
  return String(text || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "ss");
}

function search(term){
  const q = fold(term).trim();
  if(q.length < 2) return { groups: [], total: 0 };
  const hits = [];

  const walk = (node, trail, target) => {
    (node.children || []).forEach((child, i) => {
      const here = target.concat(i);
      const name = fold(child.title);
      const where = trail.join(" › ");
      let score = -1;
      if(name.startsWith(q)) score = 0;
      else if(name.includes(q)) score = 1;
      else if(fold(child.meta).includes(q) || fold(child.blurb).includes(q)) score = 2;
      else if(fold(where).includes(q)) score = 3;

      if(score >= 0) hits.push({ node: child, target: here, where, score });
      if(child.children) walk(child, trail.concat(child.title), here);
    });
  };

  TREE.sections.forEach((section, si) => {
    /* Die Bereiche selbst sind ebenfalls Treffer — «quizzes» soll den
       Bereich finden, nicht nur seinen Inhalt. */
    const name = fold(section.title);
    let score = -1;
    if(name.startsWith(q)) score = 0;
    else if(name.includes(q)) score = 1;
    else if(fold(section.blurb).includes(q)) score = 2;
    if(score >= 0) hits.push({ node: section, target: [si], where: "Bereich", score });
    walk(section, [section.title], [si]);
  });

  /* Innerhalb einer Gruppe: erst nach Güte, dann alphabetisch. */
  const byScore = (a, b) => a.score !== b.score
    ? a.score - b.score
    : a.node.title.localeCompare(b.node.title, "de");

  const folders = hits.filter(h => !h.node.file).sort(byScore);
  const entries = hits.filter(h => h.node.file).sort(byScore);

  /* Welche Gruppe zuerst kommt, entscheidet ihr bester Treffer. Sucht man
     «Biochemie», ist der gleichnamige Ordner ein Namenstreffer, die Dateien
     darin nur Pfadtreffer — dann gehört der Ordner nach oben. Vorher standen
     Einträge immer vorn, und der gesuchte Ordner rutschte auf Platz fünf. */
  const best = list => list.length ? list[0].score : 99;
  const foldersFirst = best(folders) <= best(entries);

  return {
    groups: foldersFirst
      ? [{ label: "Ordner", items: folders }, { label: "Unterlagen und Quizzes", items: entries }]
      : [{ label: "Unterlagen und Quizzes", items: entries }, { label: "Ordner", items: folders }],
    total: folders.length + entries.length
  };
}

/* Jeder Ortswechsel läuft über diesen Weg. Vorher setzte jeder Klick nur
   `path`, und wer im Impressum stand, blieb dort hängen, weil `page` gesetzt
   blieb und renderStage es zuerst abfragt. */
function goTo(target){
  page = null;
  path = target;
  revealPath(target);
  if(location.hash) history.replaceState(null, "", location.pathname + location.search);
  drawer(false);
  render();
}

/* ==================== Zeichnen ==================== */
/* ==================== Sortierung ====================
   Eine Einstellung für alle Ordner. Sie ändert nur die Anzeige, nicht die
   gespeicherte Reihenfolge — so lässt sie sich jederzeit zurückstellen, ohne
   dass am Inhaltsverzeichnis etwas geschrieben wird.

   Ordner stehen immer vor Einträgen; alles andere wäre beim Durchklicken
   verwirrend. */

const SORT_KEY = "pruefung:sort";
const SORTS = {
  manuell: { label: "Wie angelegt", cmp: null },
  az:      { label: "Name A → Z", cmp: (a,b) => a.title.localeCompare(b.title, "de") },
  za:      { label: "Name Z → A", cmp: (a,b) => b.title.localeCompare(a.title, "de") }
};
let sortMode = "manuell";
try { if(SORTS[localStorage.getItem(SORT_KEY)]) sortMode = localStorage.getItem(SORT_KEY); } catch(_) {}

/* Liefert Paare aus Kind und seinem echten Index. Der Index muss der der
   ungeordneten Liste bleiben, sonst zeigen alle Pfade ins Leere. */
function ordered(list){
  const pairs = (list || []).map((child, i) => ({ child, i }));
  const folder = p => p.child.type === "folder" || !p.child.file;
  const cmp = SORTS[sortMode].cmp;
  return pairs.sort((a, b) => {
    const fa = folder(a) ? 0 : 1, fb = folder(b) ? 0 : 1;
    if(fa !== fb) return fa - fb;
    if(!cmp) return a.i - b.i;
    return cmp(a.child, b.child);
  });
}

function sortSheet(){
  menuSheet("Sortierung", Object.keys(SORTS).map(key => ({
    label: SORTS[key].label + (sortMode === key ? "   ✓" : ""),
    run: () => {
      sortMode = key;
      try { localStorage.setItem(SORT_KEY, key); } catch(_) {}
      render();
    }
  })));
}

/* ==================== Auf- und zugeklappte Ordner ====================
   Gemerkt wird, was zugeklappt ist — nicht, was offen ist. So bleiben neu
   hinzugekommene Ordner sichtbar, statt still zuzubleiben. */

const FOLD_KEY = "pruefung:folded";
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem(FOLD_KEY) || "[]")); } catch(_) {}

const foldId = target => target.join(".");
function saveFolds(){
  try { localStorage.setItem(FOLD_KEY, JSON.stringify([...folded])); } catch(_) {}
}
function toggleFold(target){
  const id = foldId(target);
  if(folded.has(id)) folded.delete(id); else folded.add(id);
  saveFolds();
  renderRail();
}
/* Ein Ordner ist verborgen, wenn irgendein Vorfahre zugeklappt ist. */
function hidden(target){
  for(let i = 1; i < target.length; i += 1){
    if(folded.has(target.slice(0, i).join("."))) return true;
  }
  return false;
}
/* Beim Navigieren die Vorfahren des Ziels aufklappen, sonst führt ein
   Suchtreffer in einen unsichtbaren Ordner. */
function revealPath(target){
  let changed = false;
  for(let i = 1; i <= target.length; i += 1){
    const id = target.slice(0, i).join(".");
    if(folded.delete(id)) changed = true;
  }
  if(changed) saveFolds();
}

/* ==================== Mehrfachauswahl ====================
   Cmd- oder Ctrl-Klick markiert Ordner. Ein markierter Ordner lässt sich mit
   allen anderen zusammen in einem Zug verschieben. */

let picked = new Set();
const pickId = t => t.join(".");

function clearPick(){ if(picked.size){ picked.clear(); renderRail(); } }

/* Ist ein Vorfahre ebenfalls markiert, wird der Ordner mitgenommen und darf
   nicht zusätzlich einzeln verschoben werden. */
function topPicks(){
  const all = [...picked].map(id => id.split(".").map(Number));
  return all.filter(t => !all.some(o =>
    o.length < t.length && o.every((v, i) => t[i] === v)));
}

async function moveMany(targets, dest){
  const destNode = nodeAt(dest);
  const nodes = targets.map(t => ({ node: nodeAt(t), list: listAt(parentOf(t)) }));
  if(nodes.some(n => n.node === destNode)) return;
  nodes.forEach(({ node, list }) => {
    const i = list.indexOf(node);
    if(i !== -1) list.splice(i, 1);
  });
  const kids = destNode.children || (destNode.children = []);
  nodes.forEach(({ node }) => kids.push(node));
  picked.clear();
  path = pathOf(destNode) || [];
  revealPath(path);
  const what = nodes.length === 1 ? "«" + nodes[0].node.title + "»" : nodes.length + " Ordner";
  await run(what + " nach «" + destNode.title + "»",
            () => saveTree("Verschoben: " + what));
}

function renderRail(){
  const nav = $("#nav"); nav.textContent = "";
  if(!TREE) return;

  if(picked.size){
    const bar = document.createElement("div");
    bar.className = "selbar";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = picked.size + (picked.size === 1 ? " ausgewählt" : " ausgewählt");
    const move = document.createElement("button");
    move.type = "button"; move.textContent = "Verschieben";
    move.addEventListener("click", () => {
      const targets = topPicks();
      /* Ziele ausschliessen, die selbst markiert sind oder in einem markierten
         Ordner liegen — sonst zöge man einen Ast in sich selbst. */
      const blocked = new Set();
      targets.forEach(t => {
        blocked.add(JSON.stringify(t));
        folderList().forEach(f => {
          if(f.target.length > t.length && t.every((v, i) => f.target[i] === v)){
            blocked.add(JSON.stringify(f.target));
          }
        });
      });
      const choices = folderList()
        .filter(f => !blocked.has(JSON.stringify(f.target)))
        .map(f => ({ label: f.label, depth: f.depth,
                     run: () => moveMany(targets, f.target) }));
      menuSheet("Verschieben nach", choices);
    });
    const off = document.createElement("button");
    off.type = "button"; off.className = "plain"; off.textContent = "Aufheben";
    off.addEventListener("click", clearPick);
    bar.append(n, move, off);
    nav.appendChild(bar);
  }

  const add = (label, target, depth, count, isSection, hasKids) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = (isSection ? "sect" : "") + (picked.has(pickId(target)) ? " picked" : "");
    b.setAttribute("aria-selected", String(JSON.stringify(target) === JSON.stringify(path)));

    if(depth){
      const pad = document.createElement("span");
      pad.className = "pad";
      pad.style.width = (depth * 16) + "px";
      pad.setAttribute("aria-hidden", "true");
      b.appendChild(pad);
    }

    const tw = document.createElement("span");
    const closed = folded.has(foldId(target));
    tw.className = "tw" + (hasKids ? (closed ? " closed" : "") : " leaf");
    tw.textContent = "›";
    tw.setAttribute("aria-hidden", "true");
    if(hasKids){
      b.setAttribute("aria-expanded", String(!closed));
      tw.addEventListener("click", ev => { ev.stopPropagation(); toggleFold(target); });
    }
    b.appendChild(tw);

    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = label;
    const cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = count || "";
    b.append(nm, cnt);
    if(admin && target.length){
      const k = document.createElement("span");
      k.className = "kebab"; k.textContent = "•••";
      k.addEventListener("click", ev => { ev.stopPropagation(); nodeMenu(target); });
      b.appendChild(k);
    }
    b.addEventListener("click", ev => {
      /* Cmd oder Ctrl markiert, statt zu navigieren. Bereiche selbst lassen
         sich nicht verschieben und deshalb auch nicht markieren. */
      if((ev.metaKey || ev.ctrlKey) && target.length > 1){
        ev.preventDefault();
        const id = pickId(target);
        if(picked.has(id)) picked.delete(id); else picked.add(id);
        renderRail();
        return;
      }
      clearPick();
      goTo(target);
    });
    if(admin && target.length){
      makeDropTarget(b, target);
      if(target.length > 1) makeDraggable(b, target);
    }
    nav.appendChild(b);
  };

  const hasFolders = node => (node.children || []).some(c => c.type === "folder");

  TREE.sections.forEach((section, si) => {
    add(section.title, [si], 0, countQuiz(section), true, hasFolders(section));
    const walk = (node, base, depth) => {
      ordered(node.children).forEach(({ child, i }) => {
        if(child.type !== "folder") return;
        const here = base.concat(i);
        if(!hidden(here)) add(child.title, here, depth, countQuiz(child), false, hasFolders(child));
        if(depth < 6) walk(child, here, depth + 1);
      });
    };
    walk(section, [si], 1);
  });

  const quizzes = allQuizzes();
  const totals = quizzes.reduce((acc,q) => {
    const p = progressOf(q);
    acc.done += p.done; acc.total += p.total; return acc;
  }, { done:0, total:0 });
  const mini = $("#mini");
  mini.hidden = !totals.total;
  if(totals.total){
    $("#ratio").textContent = totals.done + " / " + totals.total;
    const pct = Math.round(totals.done/totals.total*100);
    requestAnimationFrame(() => { $("#pfill").style.width = pct + "%"; });
  }
  $("#lamp").className = "lamp" + (Sync.configured() && Sync.meta().lastSync ? " ok" : "");
}

/* Eine Eintragskarte — auch von der Trefferliste benutzt. */
function entryCard(child, target, showPath){
  if(child.type === "pdf"){
    const a = document.createElement("a");
    a.className = "card"; a.dataset.kind = "pdf";
    a.href = child.file; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = '<span class="ico" aria-hidden="true">▤</span>'
      + '<span class="body"><h3></h3><span class="meta"></span></span>'
      + '<span class="chev" aria-hidden="true">↗</span>';
    a.querySelector("h3").textContent = child.title;
    a.querySelector(".meta").textContent = showPath || child.meta || "PDF";
    return a;
  }

  const p = progressOf(child);
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  const done = p.total && p.done >= p.total;
  const a = document.createElement("a");
  a.className = "card"; a.dataset.kind = "quiz";
  a.href = "quiz.html?file=" + encodeURIComponent(child.file);
  a.innerHTML = '<span class="ico" aria-hidden="true">◉</span>'
    + '<span class="body"><h3></h3><span class="meta"></span>'
    + '<span class="foot"><span class="progress"><span class="progress-fill"></span></span>'
    + '<span class="stat"></span></span></span>'
    + '<span class="chev" aria-hidden="true">›</span>';
  a.querySelector("h3").textContent = child.title;
  a.querySelector(".meta").textContent = showPath || child.meta || "Kprim-Übungsprüfung";
  const fill = a.querySelector(".progress-fill");
  fill.style.display = "block"; fill.style.height = "100%";
  if(done) fill.style.background = "var(--green)";
  requestAnimationFrame(() => { fill.style.width = pct + "%"; });
  const stat = a.querySelector(".stat");
  stat.textContent = done ? "vollständig" : p.done ? p.done + " / " + p.total : "nicht begonnen";
  if(done) stat.classList.add("done");
  if(!p.done) a.querySelector(".foot").style.display = "none";
  return a;
}

  $("#title").textContent = "Suche";
  $("#sub").textContent = found.total
    ? found.total + (found.total === 1 ? " Treffer" : " Treffer") + " für «" + query.trim() + "»"
    : "Nichts gefunden für «" + query.trim() + "»";
  $("#resumeSlot").textContent = "";
  $("#listTitle").hidden = true;

  const cards = $("#cards"); cards.textContent = "";

  found.groups.forEach(group => {
    if(!group.items.length) return;
    const head = document.createElement("div");
    head.className = "grouphead";
    head.textContent = group.label + " · " + group.items.length;
    cards.appendChild(head);

    group.items.forEach(hit => {
      if(!hit.node.file){
        const card = document.createElement("button");
        card.type = "button"; card.className = "card"; card.dataset.kind = "folder";
        card.innerHTML = '<span class="ico" aria-hidden="true">▸</span>'
          + '<span class="body"><h3></h3><span class="meta"></span></span>'
          + '<span class="chev" aria-hidden="true">›</span>';

/* Die zuletzt bearbeitete, noch offene Prüfung — auf der Startseite und in
   jedem Ordner, damit man von überall zurück in die Arbeit kommt. */
function renderResume(){
  const slot = $("#resumeSlot"); slot.textContent = "";
  const stamps = Sync.meta().stamps || {};
  const open = allQuizzes()
    .map(q => ({ q, p: progressOf(q) }))
    .filter(x => x.p.done > 0 && x.p.total && x.p.done < x.p.total)
    .sort((a,b) => ((stamps[idFor(b.q)]||{}).updated||0) - ((stamps[idFor(a.q)]||{}).updated||0))[0];
  if(!open) return;
  const pct = Math.round(open.p.done/open.p.total*100);
  const el = document.createElement("a");
  el.className = "resume";
  el.href = "quiz.html?file=" + encodeURIComponent(open.q.file);
  el.innerHTML = '<div class="kick">Fortsetzen</div><h2></h2><div class="where"></div>'
    + '<div class="row"><div class="progress"><div class="progress-fill"></div></div>'
    + '<span class="pct"></span><span class="go">Weiterlösen</span></div>';
  el.querySelector("h2").textContent = open.q.title;
  el.querySelector(".where").textContent =
    (open.p.last !== null ? "Zuletzt Frage " + (open.p.last+1) + " · " : "")
    + open.p.done + " von " + open.p.total + " beantwortet";
  const bar = el.querySelector(".progress-fill");
  el.querySelector(".pct").textContent = pct + "%";
  slot.appendChild(el);
  requestAnimationFrame(() => { bar.style.width = pct + "%"; });
}

      a.rel = "noopener";

    a.dataset.kind = "quiz";

/* Der Einzug soll nur bei einem echten Ortswechsel laufen. Ein Abgleich im
   Hintergrund zeichnet dieselbe Ansicht neu — würde die dann jedes Mal
   einfliegen, wäre das nach zehn Minuten unerträglich. */
let lastView = null;

function viewKey(){
  return page ? "p:" + page
       : query.trim().length >= 2 ? "q:" + query.trim().toLowerCase()
       : "f:" + path.join(".");
}

function markEntrance(){
  const key = viewKey();
  const changed = key !== lastView;
  lastView = key;
  const cards = $("#cards");
  const head = document.querySelector(".head") || document.querySelector("article");

  cards.classList.remove("enter");
  if(head) head.classList.remove("enter-head");
  if(!changed) return;

  /* Neustart der Animation erzwingen, sonst greift sie beim zweiten Mal nicht. */
  void cards.offsetWidth;
  cards.classList.add("enter");
  [...cards.children].forEach((el, i) => el.style.setProperty("--i", Math.min(i, 12)));
  const tiles = cards.querySelector(".tiles");
  if(tiles) [...tiles.children].forEach((el, i) => el.style.setProperty("--i", i));
  if(head){ void head.offsetWidth; head.classList.add("enter-head"); }
}

function render(){
  renderRail();
  renderStage();
  updateTitle();
  markEntrance();
}

/* Der Tab-Titel nennt den Ort — bei zwanzig offenen Tabs der Unterschied
   zwischen Wiederfinden und Durchklicken. */
function updateTitle(){
  const site = (TREE && TREE.title) || "Übungsprüfungen";
  const bar = $("#mbTitle");
  if(bar){
    bar.textContent = page ? PAGES[page].title
      : query.trim().length >= 2 ? "Suche"
      : path.length ? nodeAt(path).title
      : site;
  }
  if(page) return;                                  /* renderPage setzt selbst */
  if(query.trim().length >= 2){
    document.title = "Suche: " + query.trim() + " · " + site;
  } else if(path.length){
    document.title = nodeAt(path).title + " · " + site;
  } else {
    document.title = site;
  }
}

const sheet = $("#sheet");
$("#sheetClose").addEventListener("click", () => sheet.close());

  const old = host.querySelector(".note"); if(old) old.remove();
  const box = document.createElement("div");

  box.textContent = text;

function deviceSheet(){
  $("#sheetHead").textContent = "Auf anderem Gerät fortsetzen";
  const body = $("#sheetBody"); body.textContent = "";

  if(!CFG.syncEndpoint){
    body.innerHTML = '<p class="hint">Für diese Seite ist kein Abgleich eingerichtet. '
      + 'Der Fortschritt bleibt im Browser dieses Geräts.</p>';
    sheet.showModal();
    return;
  }

  const code = Sync.ensureKey();
  body.innerHTML = '<p class="hint">Dein Fortschritt gehört zu diesem Code. '
    + 'Gib ihn auf dem anderen Gerät ein, und du machst dort weiter, wo du aufgehört hast. '
    + 'Wer den Code hat, sieht deinen Fortschritt — also nicht öffentlich teilen.</p>'
    + '<code class="code" id="mycode"></code>'
    + '<button class="btn ghost" id="copy" type="button">Code kopieren</button>'
    + '<p class="hint">Du hast schon einen Code von einem anderen Gerät? Hier eintragen — '
    + 'der Fortschritt beider Geräte wird zusammengeführt, es geht nichts verloren.</p>'
    + '<input type="text" id="incode" placeholder="Code eingeben" spellcheck="false" autocapitalize="off" autocorrect="off">'
    + '<button class="btn" id="use" type="button">Übernehmen</button>';
  body.querySelector("#mycode").textContent = code;

  body.querySelector("#copy").addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(code); note(body, "Code kopiert.", true); }
    catch(_){ note(body, "Konnte nicht kopieren — Code von Hand abtippen.", false); }
  });

  body.querySelector("#use").addEventListener("click", async () => {
    const btn = body.querySelector("#use");
    btn.disabled = true; btn.textContent = "Übernehme …";
    try{
      const result = await Sync.useKey(body.querySelector("#incode").value);
      if(!result || !result.ok) throw new Error((result && result.reason) || "Abgleich fehlgeschlagen.");
      render();
      body.querySelector("#mycode").textContent = Sync.meta().key;
      note(body, "Übernommen. Dein Fortschritt ist jetzt auf beiden Geräten gleich.", true);
    }catch(e){ note(body, e.message, false); }
    finally{ btn.disabled = false; btn.textContent = "Übernehmen"; }
  });

  sheet.showModal();
}


/* ====================================================================
   Verwaltung

   Sichtbar nur, wenn auf diesem Gerät ein GitHub-Token hinterlegt ist.
   Jede Änderung schreibt content/index.json neu und committet sie zusammen
   mit den neuen Dateien in einem Zug.
   ==================================================================== */

let admin = false;

/* Ein Blatt mit Auswahlknöpfen. Die öffentliche Fassung hat sonst nur das
   Gerätewechsel-Blatt, das seinen Inhalt selbst schreibt. */
function menuSheet(title, items){
  $("#sheetHead").textContent = title;
  const body = $("#sheetBody"); body.textContent = "";
  items.forEach(item => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pick" + (item.danger ? " danger" : "");
    if(item.depth) b.style.paddingLeft = (14 + item.depth*16) + "px";
    b.textContent = item.label;
    b.addEventListener("click", () => { sheet.close(); item.run(); });
    body.appendChild(b);
  });
  sheet.showModal();
}

function refreshAdmin(){
  admin = !!(window.Admin && Admin.enabled());
  $("#plusBtn").hidden = !admin;
  $("#addHere").hidden = !admin;
}

/* Der Baum wird lokal geändert und danach als ganze Datei committet. */
function treeJSON(){ return JSON.stringify(TREE, null, 2) + "\n"; }

async function saveTree(message, extra){
  const changes = (extra || []).concat([
    { path: (CFG.contentIndex || "content/index.json"), content: treeJSON() }
  ]);
  await Admin.commit(changes, message);
}

function parentOf(p){ return p.slice(0, -1); }
function listAt(p){
  return p.length ? (nodeAt(p).children || (nodeAt(p).children = [])) : TREE.sections;
}

/* Alle Ordner als flache Liste, für die Verschieben-Auswahl. */
function folderList(){
  const out = [];
  const walk = (node, base, depth) => {
    (node.children || []).forEach((child, i) => {
      if(child.type !== "folder") return;
      out.push({ label: child.title, target: base.concat(i), depth });
      walk(child, base.concat(i), depth + 1);
    });
  };
  TREE.sections.forEach((section, si) => {
    out.push({ label: section.title, target: [si], depth: 0 });
    walk(section, [si], 1);
  });
  return out;
}

/* ====================================================================
   Ziehen und Ablegen

   Nur im Verwaltungsmodus. Gezogen werden Ordner und Einträge, abgelegt
   wird auf Ordnern und Bereichen — in der Schiene wie in der Liste.

   Verschoben wird über Objektverweise, nicht über Indizes: sobald der
   Eintrag aus seiner alten Liste entfernt ist, verschieben sich die Indizes
   dahinter, und ein vorher gemerkter Zielindex zeigte ins Leere.
   ==================================================================== */

let dragSource = null;

function isInside(inner, outer){
  return outer.length <= inner.length
    && outer.every((v, i) => inner[i] === v);
}

function makeDraggable(el, target){
  el.draggable = true;
  el.addEventListener("dragstart", ev => {
    dragSource = target;
    el.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    /* Ohne Nutzlast verweigern manche Browser den Zug. */
    ev.dataTransfer.setData("text/plain", JSON.stringify(target));
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    dragSource = null;
    document.querySelectorAll(".into").forEach(n => n.classList.remove("into"));
  });
}

function makeDropTarget(el, target){
  const ok = () => dragSource
    && JSON.stringify(dragSource) !== JSON.stringify(target)
    && !isInside(target, dragSource);          /* nicht in sich selbst */

  el.addEventListener("dragover", ev => {
    if(!ok()) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    el.classList.add("into");
  });
  let hover = null;
  el.addEventListener("dragenter", () => {
    if(!ok()) return;
    clearTimeout(hover);
    hover = setTimeout(() => { revealPath(target); renderRail(); }, 700);
  });
  el.addEventListener("dragleave", () => {
    clearTimeout(hover);
    el.classList.remove("into");
  });
  el.addEventListener("drop", async ev => {
    ev.preventDefault();
    clearTimeout(hover);
    el.classList.remove("into");
    if(!ok()) return;
    const src = dragSource;
    dragSource = null;
    /* Wurde eine markierte Zeile gezogen, wandert die ganze Auswahl mit. */
    if(picked.has(pickId(src)) && picked.size > 1){
      await moveMany(topPicks(), target);
    } else {
      clearPick();
      await moveNode(src, target);
    }
  });
}

/* Den Indexpfad zu einem Knoten suchen. Nach dem Verschieben stimmen die
   alten Indizes nicht mehr, der Objektverweis dagegen schon. */
function pathOf(node){
  let found = null;
  const walk = (list, base) => {
    list.forEach((child, i) => {
      if(found) return;
      if(child === node){ found = base.concat(i); return; }
      if(child.children) walk(child.children, base.concat(i));
    });
  };
  walk(TREE.sections, []);
  return found;
}

async function moveNode(src, dest){
  const destNode = nodeAt(dest);
  const srcList = listAt(parentOf(src));
  const idx = src[src.length - 1];
  const moved = srcList[idx];
  if(!moved || moved === destNode) return;
  srcList.splice(idx, 1);
  (destNode.children || (destNode.children = [])).push(moved);
  /* Der Zielpfad kann sich durch das Entfernen verschoben haben. */
  path = pathOf(destNode) || [];
  revealPath(path);
  await run("«" + moved.title + "» nach «" + destNode.title + "»",
            () => saveTree("Verschoben: " + moved.title));
}

function nodeMenu(target){
  const node = nodeAt(target);
  const isSection = target.length === 1;
  const items = [
    { label: "Umbenennen", run: async () => {
        const name = prompt("Neuer Titel", node.title);
        if(!name || !name.trim()) return;
        node.title = name.trim();
        await run("Umbenannt: " + node.title, () => saveTree("Umbenannt: " + node.title));
      } }
  ];

  if(!isSection){
    items.push({ label: "Verschieben", run: () => {
      const choices = folderList()
        .filter(f => JSON.stringify(f.target) !== JSON.stringify(target)
                  && !JSON.stringify(f.target).startsWith(JSON.stringify(target).slice(0,-1)))
        .map(f => ({ label: f.label, depth: f.depth,
          run: () => moveNode(target, f.target) }));
      menuSheet("Verschieben nach", choices);
    }});

    items.push({ label: "Löschen", danger: true, run: async () => {
      const label = node.title;
      const isEntry = node.type === "pdf" || node.type === "quiz";
      if(!confirm("«" + label + "» löschen?" + (isEntry ? " Die Datei wird ebenfalls entfernt." : ""))) return;
      const file = node.file;
      listAt(parentOf(target)).splice(target[target.length-1], 1);
      path = parentOf(target);
      const extra = isEntry && file ? [{ path: file, remove: true }] : [];
      await run("Gelöscht: " + label, () => saveTree("Gelöscht: " + label, extra));
    }});
  }

  menuSheet(node.title, items);
}

/* Eine Schreibaktion mit Rückmeldung und Neuzeichnen. */
async function run(what, fn){
  const body = $("#sheetBody");
  try{
    document.body.classList.add("busy");
    await fn();
    render();
    flash(what + " · gespeichert");
  }catch(e){
    alert("Fehlgeschlagen: " + e.message + "\n\nDie Seite lädt neu, damit nichts durcheinander gerät.");
    location.reload();
  }finally{
    document.body.classList.remove("busy");
  }
}

function flash(text){
  const el = document.createElement("div");
  el.className = "note ok";
  el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;box-shadow:0 20px 50px rgba(0,0,0,.6)";
  el.textContent = text + " — in etwa einer Minute live.";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* -------------------- Hochladen -------------------- */
function uploadSheet(){
  if(!path.length){
    alert("Wähle links zuerst einen Ordner. In die Übersicht selbst lässt sich nichts legen.");
    return;
  }
  $("#sheetHead").textContent = "Hochladen nach «" + nodeAt(path).title + "»";
  const body = $("#sheetBody"); body.textContent = "";
  body.innerHTML = '<div class="drop" id="drop">PDF, HTML oder JSON hierher ziehen<br>oder klicken zum Auswählen'
    + '<input type="file" id="picker" multiple accept=".pdf,.html,.htm,.json" hidden></div>'
    + '<div class="queue" id="queue"></div>'
    + '<p class="hint">Alte HTML-Prüfungen werden beim Hochladen automatisch in JSON umgewandelt. '
    + 'Titel lassen sich vor dem Speichern noch ändern.</p>'
    + '<button class="btn" id="doUpload" type="button" hidden>Hochladen</button>';

  const drop = body.querySelector("#drop");
  const picker = body.querySelector("#picker");
  const queueEl = body.querySelector("#queue");
  const button = body.querySelector("#doUpload");
  const queue = [];

  drop.addEventListener("click", () => picker.click());
  ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => take([...(e.dataTransfer.files || [])]));
  picker.addEventListener("change", () => { take([...picker.files]); picker.value = ""; });

  async function take(files){
    for(const file of files){
      try{ queue.push(await Admin.prepare(file)); }
      catch(err){ queue.push({ error: err.message, title: file.name }); }
    }
    draw();
  }

  function draw(){
    queueEl.textContent = "";
    queue.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "qrow" + (item.error ? " bad" : "");
      const ico = document.createElement("span");
      ico.className = "qi"; ico.textContent = item.error ? "✕" : (item.kind === "pdf" ? "▤" : "◉");
      const name = document.createElement(item.error ? "span" : "input");
      if(item.error){ name.textContent = item.title; name.style.flex = "1"; }
      else { name.value = item.title; name.addEventListener("input", () => { item.title = name.value; }); }
      const meta = document.createElement("span");
      meta.className = "qm";
      meta.textContent = item.error ? item.error : (item.meta + (item.converted ? " · umgewandelt" : ""));
      const x = document.createElement("button");
      x.className = "qx"; x.type = "button"; x.textContent = "✕";
      x.addEventListener("click", () => { queue.splice(i,1); draw(); });
      row.append(ico, name, meta, x);
      queueEl.appendChild(row);
    });
    button.hidden = !queue.some(q => !q.error);
  }

  button.addEventListener("click", async () => {
    const good = queue.filter(q => !q.error);
    if(!good.length) return;
    button.disabled = true; button.textContent = "Lade hoch …";
    const folder = path.map(i => "x").length;   /* nur zur Lesbarkeit */
    const base = "content/" + (nodeAt([path[0]]).id === "quizzes" ? "quizzes" : "unterlagen") + "/";
    const extra = [];
    good.forEach(item => {
      const file = base + Admin.slug(item.title) + (item.kind === "pdf" ? ".pdf" : ".json");
      extra.push({ path: file, content: item.content });
      listAt(path).push({
        type: item.kind, title: item.title, file,
        meta: item.meta
      });
    });
    try{
      document.body.classList.add("busy");
      await saveTree("Hochgeladen: " + good.map(g => g.title).join(", "), extra);
      sheet.close(); render();
      flash(good.length + (good.length === 1 ? " Datei" : " Dateien") + " hochgeladen");
    }catch(e){
      alert("Fehlgeschlagen: " + e.message);
      location.reload();
    }finally{
      document.body.classList.remove("busy");
      button.disabled = false; button.textContent = "Hochladen";
    }
  });

  sheet.showModal();
}

/* ==================== Darstellung ====================
   Derselbe Speicherschlüssel wie in quiz.html, damit beide Seiten dieselbe
   Einstellung benutzen und nicht auseinanderlaufen. */

const THEME_KEY = "kprim-ui-theme";
const media = window.matchMedia("(prefers-color-scheme: dark)");
let themeMode = "auto";
try { themeMode = localStorage.getItem(THEME_KEY) || "auto"; } catch(_) {}

function applyTheme(){
  const dark = themeMode === "dark" || (themeMode === "auto" && media.matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function setTheme(mode){
  themeMode = mode;
  try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
  applyTheme();
}
media.addEventListener("change", () => { if(themeMode === "auto") applyTheme(); });
applyTheme();

function settingsSheet(){
  const label = { light: "Hell", dark: "Dunkel", auto: "Automatisch" };
  menuSheet("Darstellung", ["light", "dark", "auto"].map(mode => ({
    label: label[mode] + (mode === "auto" ? " · folgt dem System" : "")
           + (themeMode === mode ? "   ✓" : ""),
    run: () => { setTheme(mode); }
  })));
}

   der Zeile, damit man ihn sieht, ohne hineinzugehen. */

      run: settingsSheet },

    { label: "Auf anderem Gerät fortsetzen"
             + (Sync.configured() && Sync.meta().lastSync ? " · aktiv" : ""),
      run: deviceSheet }
  ];

    items.push({ label: admin ? "Verwaltung · angemeldet" : "Verwaltung", run: adminSheet });
  }
  menuSheet("Einstellungen", items);
}

/* ==================== Schublade auf dem Telefon ====================
   Auf schmalen Geräten liegt die Schiene neben dem Bild und fährt herein.
   Jede Navigation schliesst sie wieder, sonst verdeckt sie das Ergebnis. */

function drawer(open){
  document.body.classList.toggle("drawer", open);
  $("#drawerBtn").setAttribute("aria-expanded", String(open));
}
const isNarrow = () => window.matchMedia("(max-width: 860px)").matches;
$("#drawerBtn").addEventListener("click", () => drawer(!document.body.classList.contains("drawer")));
$("#scrim").addEventListener("click", () => drawer(false));
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(document.body.classList.contains("drawer")) drawer(false);
  else clearPick();
});
window.addEventListener("resize", () => { if(!isNarrow()) drawer(false); });

   Inhalt darunter durchläuft. */
const onScroll = () => document.body.classList.toggle("scrolled", window.scrollY > 4);
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();

/* ==================== Seitenleiste ====================
   Der Zustand bleibt pro Gerät erhalten. Auf schmalen Geräten ist die
   Schiene eine Leiste am oberen Rand — dort gibt es nichts einzuklappen. */

const RAIL_KEY = "pruefung:rail";
function applyRail(){
  let off = false;
  try { off = localStorage.getItem(RAIL_KEY) === "off"; } catch(_) {}
  document.body.classList.toggle("rail-off", off);
}
function toggleRail(){
  const off = !document.body.classList.contains("rail-off");
  try { localStorage.setItem(RAIL_KEY, off ? "off" : "on"); } catch(_) {}
  document.body.classList.toggle("rail-off", off);
}
$("#railToggle").addEventListener("click", toggleRail);
$("#railShow").addEventListener("click", toggleRail);
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b"){
    e.preventDefault(); toggleRail();
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
